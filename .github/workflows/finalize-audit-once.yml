name: Finalize Native Audit Once

on:
  push:
    branches:
      - fix/single-pr-relay-reliability-audit
    paths:
      - .github/workflows/finalize-audit-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Make final guarded changes and self-remove automation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          function ReplaceOnce([string]$text, [string]$before, [string]$after, [string]$label) {
            $i = $text.IndexOf($before, [StringComparison]::Ordinal)
            if ($i -lt 0 -or $text.IndexOf($before, $i + $before.Length, [StringComparison]::Ordinal) -ge 0) { throw ('Expected exactly one ' + $label) }
            return $text.Substring(0, $i) + $after + $text.Substring($i + $before.Length)
          }
          $enginePath = Join-Path $env:GITHUB_WORKSPACE 'src\BpsrRelayManager\RelayEngine.cs'
          $engine = [IO.File]::ReadAllText($enginePath).Replace("`r`n", "`n")
          $engine = ReplaceOnce $engine "            AssertFrontPortFree(ip);`n            AssertFrontPortFree(ip);" '            AssertFrontPortFree(ip);' 'duplicate port guard'
          $engine = ReplaceOnce $engine "        public void MarkPhoneProfileDownloaded()`n        {`n            string id = GetCurrentProfileId();`n            if (string.IsNullOrWhiteSpace(id)) return;" "        public void MarkPhoneProfileDownloaded()`n        {`n            string id = GetCurrentProfileId();`n            // A second SFA/browser download cannot revoke explicit confirmation for the same profile.`n            if (string.IsNullOrWhiteSpace(id) || PhoneProfileConfirmed()) return;" 'preserve confirmed phone identity'
          [IO.File]::WriteAllText($enginePath, $engine, $utf8)

          $readinessPath = Join-Path $env:GITHUB_WORKSPACE 'scripts\TestNativeReadiness.ps1'
          $readiness = [IO.File]::ReadAllText($readinessPath).Replace("`r`n", "`n")
          $readiness = ReplaceOnce $readiness 'info.Invoke(engine, new object[] { argument });' 'info.Invoke(engine, info.GetParameters().Length == 0 ? null : new object[] { argument });' 'zero argument reflection handling'
          [IO.File]::WriteAllText($readinessPath, $readiness, $utf8)

          $smokePath = Join-Path $env:GITHUB_WORKSPACE 'scripts\TestRelaySmoke.ps1'
          $smoke = [IO.File]::ReadAllText($smokePath).Replace("`r`n", "`n")
          $insertion = @'
              $udpScript = Join-Path $scriptDir 'TestSocksUdp.ps1'
              if (-not (Test-Path -LiteralPath $udpScript -PathType Leaf)) { throw 'Authenticated SOCKS5 UDP test is missing.' }
              & $udpScript -FrontPort $frontPort -Username $frontUsername -Password $frontPassword
              if ($LASTEXITCODE -ne 0) { throw 'Two-stage UDP smoke test failed.' }
              $frontProcess.Refresh()
              $backProcess.Refresh()
              Write-Host ('LOCAL SYNTHETIC RELAY RESOURCE SNAPSHOT: front working set ' + [Math]::Round($frontProcess.WorkingSet64 / 1MB, 1) + ' MB, back working set ' + [Math]::Round($backProcess.WorkingSet64 / 1MB, 1) + ' MB; handle counts ' + $frontProcess.HandleCount + '/' + $backProcess.HandleCount + '. Not a gameplay benchmark.')

              $curl = Get-Command curl.exe -ErrorAction Stop
'@
          $insertion = ($insertion -split "`n" | ForEach-Object { $_.TrimStart() }) -join "`n"
          $insertion = $insertion.Replace("`n", "`n    ").TrimEnd()
          $smoke = ReplaceOnce $smoke '    $curl = Get-Command curl.exe -ErrorAction Stop' ('    ' + $insertion) 'UDP and process instrumentation'
          [IO.File]::WriteAllText($smokePath, $smoke, $utf8)

          $workflow = Join-Path $env:GITHUB_WORKSPACE '.github\workflows\finalize-audit-once.yml'
          Remove-Item -LiteralPath $workflow -Force
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(relay): preserve confirmation and cover native readiness plus UDP'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git fetch origin fix/single-pr-relay-reliability-audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rebase origin/fix/single-pr-relay-reliability-audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:fix/single-pr-relay-reliability-audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
