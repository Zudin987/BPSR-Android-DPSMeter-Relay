name: Finalize Native Audit Once

on:
  push:
    branches:
      - fix/single-pr-relay-reliability-audit
    paths:
      - .github/workflows/finalize-audit-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply final native and regression changes and remove workflow
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          function ReplaceOnce([string]$text, [string]$before, [string]$after, [string]$label) {
            $i = $text.IndexOf($before, [StringComparison]::Ordinal)
            if ($i -lt 0 -or $text.IndexOf($before, $i + $before.Length, [StringComparison]::Ordinal) -ge 0) { throw ('Expected exactly one ' + $label) }
            return $text.Substring(0, $i) + $after + $text.Substring($i + $before.Length)
          }
          $enginePath = Join-Path $env:GITHUB_WORKSPACE 'src\BpsrRelayManager\RelayEngine.cs'
          $engine = [IO.File]::ReadAllText($enginePath).Replace("`r`n", "`n")
          $engine = ReplaceOnce $engine "            AssertFrontPortFree(ip);`n            AssertFrontPortFree(ip);" '            AssertFrontPortFree(ip);' 'duplicate port guard'
          $engine = ReplaceOnce $engine "        public void MarkPhoneProfileDownloaded()`n        {`n            string id = GetCurrentProfileId();`n            if (string.IsNullOrWhiteSpace(id)) return;" "        public void MarkPhoneProfileDownloaded()`n        {`n            string id = GetCurrentProfileId();`n            // A second SFA/browser download cannot revoke explicit confirmation for this profile.`n            if (string.IsNullOrWhiteSpace(id) || PhoneProfileConfirmed()) return;" 'confirmed phone identity preservation'
          [IO.File]::WriteAllText($enginePath, $engine, $utf8)
          $readinessPath = Join-Path $env:GITHUB_WORKSPACE 'scripts\TestNativeReadiness.ps1'
          $readiness = [IO.File]::ReadAllText($readinessPath).Replace("`r`n", "`n")
          $readiness = ReplaceOnce $readiness 'info.Invoke(engine, new object[] { argument });' 'info.Invoke(engine, info.GetParameters().Length == 0 ? null : new object[] { argument });' 'reflection argument count'
          [IO.File]::WriteAllText($readinessPath, $readiness, $utf8)
          $smokePath = Join-Path $env:GITHUB_WORKSPACE 'scripts\TestRelaySmoke.ps1'
          $smoke = [IO.File]::ReadAllText($smokePath).Replace("`r`n", "`n")
          $lines = @(
            '    $udpScript = Join-Path $scriptDir ''TestSocksUdp.ps1'''
            '    if (-not (Test-Path -LiteralPath $udpScript -PathType Leaf)) { throw ''Authenticated SOCKS5 UDP test missing.'' }'
            '    & $udpScript -FrontPort $frontPort -Username $frontUsername -Password $frontPassword'
            '    $frontProcess.Refresh()'
            '    $backProcess.Refresh()'
            '    Write-Host (''LOCAL SYNTHETIC RESOURCE SNAPSHOT: front/back working set MB '' + [Math]::Round($frontProcess.WorkingSet64 / 1MB, 1) + ''/'' + [Math]::Round($backProcess.WorkingSet64 / 1MB, 1) + ''; handles '' + $frontProcess.HandleCount + ''/'' + $backProcess.HandleCount + ''. Not real gameplay benchmarking.'')'
            '    $curl = Get-Command curl.exe -ErrorAction Stop'
          )
          $insertion = [string]::Join("`n", [string[]]$lines)
          $smoke = ReplaceOnce $smoke '    $curl = Get-Command curl.exe -ErrorAction Stop' $insertion 'UDP smoke and process sample'
          [IO.File]::WriteAllText($smokePath, $smoke, $utf8)
          Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE '.github\workflows\finalize-audit-once.yml') -Force
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(tests): preserve phone confirmation and exercise UDP relay'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git fetch origin fix/single-pr-relay-reliability-audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rebase origin/fix/single-pr-relay-reliability-audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:fix/single-pr-relay-reliability-audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
