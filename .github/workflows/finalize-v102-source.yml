name: Finalize v1.0.2 Source

on:
  push:
    branches:
      - fix/firewall-verification-v1.0.2

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/firewall-verification-v1.0.2
          fetch-depth: 0
      - name: Promote manager version to stable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/BPSRRelayManager.ps1')
          s = p.read_text(encoding='utf-8')
          old = "$ManagerVersion = '1.0.2-rc.1'"
          new = "$ManagerVersion = '1.0.2'"
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8', newline='')
          elif new not in s:
              raise SystemExit('Unexpected ManagerVersion; refusing to edit')
          PY
          grep -F "$ManagerVersion = '1.0.2'" scripts/BPSRRelayManager.ps1 >/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/BPSRRelayManager.ps1
          if git diff --cached --quiet; then
            echo 'Stable source already finalized.'
            exit 0
          fi
          git commit -m 'Finalize v1.0.2 stable version'
          git push origin HEAD:fix/firewall-verification-v1.0.2
