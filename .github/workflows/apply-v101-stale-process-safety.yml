name: Apply v1.0.1 audit fixes

on:
  push:
    branches:
      - feature/v1.0.1-hardening
    paths:
      - scripts/ApplyV101AuditFixes.ps1
      - .github/workflows/apply-v101-stale-process-safety.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.0.1-hardening
      - name: Apply audited fixes
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\scripts\ApplyV101AuditFixes.ps1'
