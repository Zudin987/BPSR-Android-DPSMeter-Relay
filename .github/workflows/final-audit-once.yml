name: Final audit patch (one time)
on:
  push:
    branches: [fix/final-reliability-audit-v114]
    paths: ['.github/workflows/final-audit-once.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply source fixes and fault-injection tests
        run: |
          python3 scripts/apply-final-audit-once.py
          python3 scripts/add-final-regressions-once.py
          git diff --check
          git checkout -- .github/workflows/validate.yml
          git diff --check
      - name: Commit only application and test code
        run: |
          git add src/BpsrRelayManager/RelayEngine.cs src/BpsrRelayManager/MainForm.cs src/BpsrRelayManager/ProfileServer.cs src/BpsrRelayManager/VersionInfo.cs src/BpsrRelayManager/WindowsApiSelfTest.cs docs/releases/v1.1.4.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: harden relay recovery and test corrupt profiles'
          git push origin HEAD:fix/final-reliability-audit-v114
