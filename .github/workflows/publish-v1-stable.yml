name: Publish Stable v1.0.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1-stable.yml

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: github.event.head_commit.message == 'Publish stable v1.0.0'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RELEASE_SHA: d32bc494a0b789e2633fd0b7ea064b7f9389503e
      RELEASE_VERSION: 1.0.0
      FIELD_TEST_PASSED: YES
    steps:
      - name: Checkout exact clean merged commit
        uses: actions/checkout@v4
        with:
          ref: d32bc494a0b789e2633fd0b7ea064b7f9389503e

      - name: Enforce stable release gate
        shell: powershell
        run: |
          $version = $env:RELEASE_VERSION.Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Stable version must be plain semver.' }
          if ($env:FIELD_TEST_PASSED -ne 'YES') { throw 'Stable release blocked: field test is not confirmed.' }

          $checkedOut = (git rev-parse HEAD).Trim()
          if ($checkedOut -ne $env:RELEASE_SHA) { throw ('Wrong source checkout: ' + $checkedOut) }

          $manager = Get-Content '.\scripts\BPSRRelayManager.ps1' -Raw
          $match = [regex]::Match($manager, '^\$ManagerVersion\s*=\s*''([^'']+)''', [System.Text.RegularExpressions.RegexOptions]::Multiline)
          if (-not $match.Success) { throw 'Could not read ManagerVersion.' }
          if ($match.Groups[1].Value.Trim() -ne $version) { throw 'Source version does not match stable version.' }

          $readme = Get-Content '.\README.md' -Raw
          if ($readme -match '1\.0\.0-rc\.' -or $readme -match '(?i)release candidate' -or $readme -match 'NOT quite yet') {
            throw 'README still contains prerelease/release-gate wording.'
          }
          Write-Host ('Stable source/documentation/field-test gate passed for v' + $version + '.')

      - name: Require green Validate run for exact clean commit
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $json = gh run list `
            --repo '${{ github.repository }}' `
            --workflow 'Validate' `
            --commit $env:RELEASE_SHA `
            --limit 20 `
            --json databaseId,status,conclusion,event,headSha
          if ($LASTEXITCODE -ne 0) { throw 'Could not query Validate workflow history.' }
          $runs = @($json | ConvertFrom-Json)
          $passed = @($runs | Where-Object {
            $_.headSha -eq $env:RELEASE_SHA -and $_.status -eq 'completed' -and $_.conclusion -eq 'success'
          })
          if ($passed.Count -eq 0) { throw ('Exact clean commit has no successful Validate run: ' + $env:RELEASE_SHA) }
          Write-Host ('Exact-commit Validate gate passed using run ' + $passed[0].databaseId + '.')

      - name: Parse PowerShell with Windows PowerShell 5.1
        shell: powershell
        run: |
          Get-ChildItem '.\scripts' -Filter '*.ps1' -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          }
          Write-Host 'PowerShell syntax OK.'

      - name: Run relay config self-test
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\scripts\BPSRRelayManager.ps1' -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test v4-compatible two-stage relay data path
        shell: powershell
        run: |
          $singBox = Join-Path $env:GITHUB_WORKSPACE '.runtime\sing-box.exe'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\scripts\TestRelaySmoke.ps1' -SingBoxExe $singBox
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build clean release package
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\scripts\BuildRelease.ps1' -OutputDirectory 'dist' -Clean
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish GitHub release from exact clean commit
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v' + $env:RELEASE_VERSION
          $zip = Get-ChildItem '.\dist' -Filter '*.zip' -File | Select-Object -First 1
          $sha = Get-ChildItem '.\dist' -Filter '*.sha256' -File | Select-Object -First 1
          if (-not $zip -or -not $sha) { throw 'Release assets are missing.' }

          gh release view $tag --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) { throw ('Release ' + $tag + ' already exists. Refusing to overwrite it.') }

          gh release create $tag $zip.FullName $sha.FullName `
            --repo '${{ github.repository }}' `
            --target $env:RELEASE_SHA `
            --title ('BPSR Android DPSMeter Relay ' + $tag) `
            --generate-notes `
            --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
          Write-Host ('Published ' + $tag + ' from exact clean commit ' + $env:RELEASE_SHA)
