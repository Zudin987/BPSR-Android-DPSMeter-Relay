          new_candidates = r'''$candidates = @(Get-LanIPv4Candidates)
$seen = @{}
foreach ($candidate in $candidates) {
    if (-not $seen.ContainsKey($candidate.IP)) {
        $display = ([string]$candidate.Interface) + '  -  ' + ([string]$candidate.IP)
