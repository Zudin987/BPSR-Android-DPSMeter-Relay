name: Apply guided UX guardrails

on:
  push:
    branches:
      - feat/ux-guided-misuse-guardrails
    paths:
      - .github/workflows/apply-ux-guided-guardrails.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UX branch
        uses: actions/checkout@v4
        with:
          ref: feat/ux-guided-misuse-guardrails
          fetch-depth: 0

      - name: Apply guided misuse-resistant UX
        run: python3 .github/apply_ux.py

      - name: Commit UX changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ManagerUi.ps1 scripts/BPSRRelayManager.ps1 README.md
          git diff --cached --quiet && { echo "No UX changes generated"; exit 1; }
          git commit -m "Align readiness checks with guided phone setup"
          git push origin HEAD:feat/ux-guided-misuse-guardrails
