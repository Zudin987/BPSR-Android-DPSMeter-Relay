name: Prepare v1.0.5

on:
  push:
    branches:
      - release/v1.0.5
    paths:
      - .github/workflows/prepare-v105.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.0.5

      - name: Bump source and release default
        shell: pwsh
        run: |
          $managerPath = 'scripts/BPSRRelayManager.ps1'
          $manager = Get-Content $managerPath -Raw
          $oldManager = "$ManagerVersion = '1.0.4'"
          $newManager = "$ManagerVersion = '1.0.5'"
          if (-not $manager.Contains($oldManager)) { throw 'Expected v1.0.4 ManagerVersion was not found.' }
          $manager = $manager.Replace($oldManager, $newManager)
          [System.IO.File]::WriteAllText((Join-Path $PWD $managerPath), $manager, (New-Object System.Text.UTF8Encoding($false)))

          $releasePath = '.github/workflows/release.yml'
          $release = Get-Content $releasePath -Raw
          $oldDefault = "default: '1.0.4'"
          $newDefault = "default: '1.0.5'"
          if (-not $release.Contains($oldDefault)) { throw 'Expected v1.0.4 release default was not found.' }
          $release = $release.Replace($oldDefault, $newDefault)
          [System.IO.File]::WriteAllText((Join-Path $PWD $releasePath), $release, (New-Object System.Text.UTF8Encoding($false)))

          Remove-Item '.github/workflows/prepare-v105.yml' -Force

      - name: Commit release preparation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/BPSRRelayManager.ps1 .github/workflows/release.yml .github/workflows/prepare-v105.yml
          git commit -m "Prepare v1.0.5 release"
          git push origin HEAD:release/v1.0.5
