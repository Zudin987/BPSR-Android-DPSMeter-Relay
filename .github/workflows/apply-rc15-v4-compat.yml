name: Apply RC15 V4 Compatibility

# retry after repairing all encoded patch chunks
on:
  push:
    branches:
      - feature/user-friendly-manager
    paths:
      - .github/workflows/apply-rc15-v4-compat.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/user-friendly-manager
          fetch-depth: 0

      - name: Apply validated RC15 patch
        shell: python
        run: |
          import base64, gzip, pathlib, subprocess
          parts = sorted(pathlib.Path('.rc15').glob('part*.txt'), key=lambda p: int(p.stem.replace('part','')))
          if len(parts) != 6:
              raise SystemExit(f'Expected 6 patch parts, found {len(parts)}')
          payload = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          patch = gzip.decompress(base64.b64decode(payload))
          path = pathlib.Path('rc15.patch')
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', str(path)], check=True)
          path.unlink()

      - name: Verify source shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq "1.0.0-rc.15" scripts/BPSRRelayManager.ps1
          grep -Fq "FrontPort = 10808" scripts/BPSRRelayManager.ps1
          grep -Fq "BPSRMobileFront.exe" scripts/BPSRRelayManager.ps1
          grep -Fq "v4-compatible-socks5" scripts/BPSRRelayManager.ps1
          grep -Fq "Remove old RC.14 profile" scripts/ManagerUi.ps1
          grep -Fq "Current test build: **v1.0.0-rc.15**" README.md

      - name: Commit clean RC15 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md scripts/BPSRRelayManager.ps1 scripts/ManagerUi.ps1
          git rm -r .rc15 .github/workflows/apply-rc15-v4-compat.yml
          git diff --cached --check
          git commit -m "Restore Clean v4 relay path for RC15"
          git push origin HEAD:feature/user-friendly-manager
