name: Native Regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native-profile-and-flow:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell regression test
        shell: powershell
        run: |
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE 'scripts\TestNativeProfileServer.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - name: Build native relay manager
        shell: powershell
        run: |
          & '.\scripts\BuildNativeManager.ps1' -OutputPath '.build\native\BPSR Relay Manager.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise actual native profile setup server
        shell: powershell
        run: |
          & '.\scripts\TestNativeProfileServer.ps1' -ManagerExe '.build\native\BPSR Relay Manager.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native two-stage relay smoke test
        shell: powershell
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE '.native-regression'
          & '.\.build\native\BPSR Relay Manager.exe' --self-test --self-test-root $root
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & '.\scripts\TestRelaySmoke.ps1' -SingBoxExe (Join-Path $root '.runtime\sing-box.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
