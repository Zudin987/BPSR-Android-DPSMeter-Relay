name: Refine relay health implementation

on:
  push:
    branches:
      - fix/relay-reliability-health
    paths:
      - .github/workflows/refine-relay-health.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/relay-reliability-health
          fetch-depth: 0

      - name: Align health checks with pinned sing-box behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          manager_path = Path('scripts/BPSRRelayManager.ps1')
          smoke_path = Path('scripts/TestRelaySmoke.ps1')
          manager = manager_path.read_text(encoding='utf-8')
          smoke = smoke_path.read_text(encoding='utf-8')

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          manager = once(manager,
          '''function Test-ProcessRelayListeners {
              param(
                  [int]$ProcessId,
                  [string]$Address,
                  [int]$Port,
                  [switch]$TcpOnly
              )

              if ($ProcessId -le 0 -or $Port -le 0) { return $false }
              $tcpReady = @(Get-ListeningConnections -Port $Port | Where-Object {
                  [int]$_.OwningProcess -eq $ProcessId -and
                  ([string]$_.LocalAddress -eq $Address -or [string]$_.LocalAddress -eq '0.0.0.0')
              }).Count -gt 0
              if (-not $tcpReady) { return $false }
              if ($TcpOnly) { return $true }

              $udpReady = @(Get-ListeningUdpEndpoints -Port $Port | Where-Object {
                  [int]$_.OwningProcess -eq $ProcessId -and
                  ([string]$_.LocalAddress -eq $Address -or [string]$_.LocalAddress -eq '0.0.0.0')
              }).Count -gt 0
              return $udpReady
          }
          ''',
          '''function Test-ProcessRelayTcpListener {
              param(
                  [int]$ProcessId,
                  [string]$Address,
                  [int]$Port
              )

              if ($ProcessId -le 0 -or $Port -le 0) { return $false }
              return @(Get-ListeningConnections -Port $Port | Where-Object {
                  [int]$_.OwningProcess -eq $ProcessId -and
                  ([string]$_.LocalAddress -eq $Address -or [string]$_.LocalAddress -eq '0.0.0.0')
              }).Count -gt 0
          }
          ''', 'TCP listener helper')

          manager = manager.replace(
              '$frontOk = Test-ProcessRelayListeners -ProcessId $script:trackedFrontPid -Address $script:trackedPcIp -Port $FrontPort',
              '$frontOk = Test-ProcessRelayTcpListener -ProcessId $script:trackedFrontPid -Address $script:trackedPcIp -Port $FrontPort')
          manager = manager.replace(
              "$starOk = Test-ProcessRelayListeners -ProcessId $script:trackedStarPid -Address '127.0.0.1' -Port $script:trackedInternalPort",
              "$starOk = Test-ProcessRelayTcpListener -ProcessId $script:trackedStarPid -Address '127.0.0.1' -Port $script:trackedInternalPort")
          manager = manager.replace(
              "$script:lastListenerHealthDetail = 'TCP+UDP listeners healthy'",
              "$script:lastListenerHealthDetail = 'TCP listeners healthy; UDP remains on-demand and port/firewall guarded'")

          manager = once(manager,
          '''function Wait-ForProcessListener {
              param(
                  [int]$ProcessId,
                  [string]$Address,
                  [int]$Port,
                  [string]$ProcessLabel,
                  [switch]$TcpOnly
              )

              for ($i = 0; $i -lt 50; $i++) {
                  try {
                      $process = Get-Process -Id $ProcessId -ErrorAction Stop
                      if ($process.HasExited) { throw ($ProcessLabel + ' exited during startup.') }
                  }
                  catch { throw ($ProcessLabel + ' exited during startup.') }

                  if (Test-ProcessRelayListeners -ProcessId $ProcessId -Address $Address -Port $Port -TcpOnly:$TcpOnly) { return }
                  Start-Sleep -Milliseconds 100
              }
              $protocols = if ($TcpOnly) { 'TCP' } else { 'TCP+UDP' }
              throw ($ProcessLabel + ' did not begin listening on ' + $Address + ':' + $Port + ' for ' + $protocols + ' within 5 seconds.')
          }
          ''',
          '''function Wait-ForProcessListener {
              param(
                  [int]$ProcessId,
                  [string]$Address,
                  [int]$Port,
                  [string]$ProcessLabel
              )

              for ($i = 0; $i -lt 50; $i++) {
                  try {
                      $process = Get-Process -Id $ProcessId -ErrorAction Stop
                      if ($process.HasExited) { throw ($ProcessLabel + ' exited during startup.') }
                  }
                  catch { throw ($ProcessLabel + ' exited during startup.') }

                  if (Test-ProcessRelayTcpListener -ProcessId $ProcessId -Address $Address -Port $Port) { return }
                  Start-Sleep -Milliseconds 100
              }
              throw ($ProcessLabel + ' did not begin TCP listening on ' + $Address + ':' + $Port + ' within 5 seconds.')
          }
          ''', 'TCP startup wait')

          manager = manager.replace(" -ProcessLabel 'Phone setup server' -TcpOnly", " -ProcessLabel 'Phone setup server'")
          manager = manager.replace(
              'Phone relay UDP listener: $udpListenerText',
              'Phone relay UDP endpoint (on-demand; none is normal): $udpListenerText')
          manager = manager.replace(
              '# Gameplay hot path: once the tracked two-process relay is running, status polling must remain tiny.\n    # Do not hash the runtime, enumerate adapters, reread PID JSON, or resolve executable paths every timer tick.',
              '# Gameplay hot path: PID/start-time checks stay tiny on every timer tick.\n    # Listener-table verification is cached for 10 seconds; never hash the runtime, enumerate adapters, reread PID JSON, or resolve executable paths every tick.')

          smoke = once(smoke,
          '''function Assert-RelayListeners {
              param([int]$ProcessId, [int]$Port, [string]$Label)
              $tcp = @(Get-NetTCPConnection -State Listen -LocalPort $Port -ErrorAction SilentlyContinue | Where-Object { [int]$_.OwningProcess -eq $ProcessId })
              $udp = @(Get-NetUDPEndpoint -LocalPort $Port -ErrorAction SilentlyContinue | Where-Object { [int]$_.OwningProcess -eq $ProcessId })
              if ($tcp.Count -eq 0 -or $udp.Count -eq 0) { throw ($Label + ' did not expose both TCP and UDP listeners on port ' + $Port + '.') }
          }
          ''',
          '''function Assert-RelayTcpListener {
              param([int]$ProcessId, [int]$Port, [string]$Label)
              $tcp = @(Get-NetTCPConnection -State Listen -LocalPort $Port -ErrorAction SilentlyContinue | Where-Object { [int]$_.OwningProcess -eq $ProcessId })
              if ($tcp.Count -eq 0) { throw ($Label + ' did not expose its TCP listener on port ' + $Port + '.') }
          }
          ''', 'smoke TCP listener helper')
          smoke = smoke.replace('Assert-RelayListeners -ProcessId $backProcess.Id -Port $backPort', 'Assert-RelayTcpListener -ProcessId $backProcess.Id -Port $backPort')
          smoke = smoke.replace('Assert-RelayListeners -ProcessId $frontProcess.Id -Port $frontPort', 'Assert-RelayTcpListener -ProcessId $frontProcess.Id -Port $frontPort')
          smoke = smoke.replace(
              'V4-COMPAT RELAY SMOKE PASS: TCP+UDP listener readiness; SOCKS client -> BPSRMobileFront -> localhost StarSEA -> direct HTTP target.',
              'V4-COMPAT RELAY SMOKE PASS: TCP listener readiness + TCP/UDP port availability; SOCKS client -> BPSRMobileFront -> localhost StarSEA -> direct HTTP target.')

          required_manager = [
              'function Test-ProcessRelayTcpListener',
              'TCP listeners healthy; UDP remains on-demand and port/firewall guarded',
              'Listener-table verification is cached for 10 seconds',
              'Phone relay UDP endpoint (on-demand; none is normal):',
          ]
          for needle in required_manager:
              if needle not in manager:
                  raise SystemExit(f'missing refined manager invariant: {needle}')
          if 'Test-ProcessRelayListeners' in manager or 'TCP+UDP listeners healthy' in manager:
              raise SystemExit('stale persistent-UDP health assumption remains in manager')
          if 'Assert-RelayListeners' in smoke or 'both TCP and UDP listeners' in smoke:
              raise SystemExit('stale persistent-UDP smoke assumption remains')
          if 'Get-FreeRelayPort' not in smoke or 'UdpClient' not in smoke:
              raise SystemExit('TCP+UDP port collision guard was accidentally removed')

          manager_path.write_text(manager, encoding='utf-8', newline='\n')
          smoke_path.write_text(smoke, encoding='utf-8', newline='\n')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/BPSRRelayManager.ps1 scripts/TestRelaySmoke.ps1
          git commit -m "Align relay health checks with sing-box UDP behavior"
          git push origin HEAD:fix/relay-reliability-health
