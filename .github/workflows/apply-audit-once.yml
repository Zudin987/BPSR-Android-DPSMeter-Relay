name: Apply Native Audit Once

on:
  push:
    branches:
      - fix/single-pr-relay-reliability-audit
    paths:
      - .github/workflows/apply-audit-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply guarded native edits and remove temporary automation
        shell: powershell
        run: |
          $patch = Join-Path $env:GITHUB_WORKSPACE 'scripts\ApplyAuditRefactor.ps1'
          $source = [System.IO.File]::ReadAllText($patch).Replace("`r`n", "`n")
          $needle = "            AssertFrontPortFree(ip);`n            RelayCredentials creds = GetOrCreateCredentials();"
          $position = $source.IndexOf($needle, [StringComparison]::Ordinal)
          if ($position -lt 0 -or $source.IndexOf($needle, $position + $needle.Length, [StringComparison]::Ordinal) -ge 0) { throw 'Launch-integrity patch anchor missing or ambiguous.' }
          $source = $source.Remove($position, "            AssertFrontPortFree(ip);`n".Length)
          [System.IO.File]::WriteAllText($patch, $source, (New-Object System.Text.UTF8Encoding($false)))
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($patch, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          & $patch
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(native): unify readiness, nonblocking lifecycle and integrity recovery'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git fetch origin fix/single-pr-relay-reliability-audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rebase origin/fix/single-pr-relay-reliability-audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:fix/single-pr-relay-reliability-audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
