name: Fix v1.0.1 stale start-time parse

on:
  push:
    branches:
      - feature/v1.0.1-hardening
    paths:
      - .github/workflows/fix-v101-stale-start-parse.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.0.1-hardening
      - name: Restore explicit stale start-time parse
        shell: powershell
        run: |
          $path = '.\scripts\ManagerUi.ps1'
          $text = [System.IO.File]::ReadAllText($path).Replace("`r`n", "`n")
          $needle = @'
            if ([string]::IsNullOrWhiteSpace([string]$item.StartUtc)) {
                Add-Log ('Skipped old relay PID ' + $item.Id + ' because its start-time identity could not be recorded. Refresh and try again.')
                continue
            }

            $expectedPath = Get-ExpectedRelayPath -ProcessName ([string]$item.Name)
'@.Replace("`r`n", "`n")
          $replacement = @'
            if ([string]::IsNullOrWhiteSpace([string]$item.StartUtc)) {
                Add-Log ('Skipped old relay PID ' + $item.Id + ' because its start-time identity could not be recorded. Refresh and try again.')
                continue
            }

            # Parse the recorded identity up front so malformed state is rejected
            # before any process-management decision is made.
            $expectedStart = [DateTime]::Parse([string]$item.StartUtc)

            $expectedPath = Get-ExpectedRelayPath -ProcessName ([string]$item.Name)
'@.Replace("`r`n", "`n")
          if (-not $text.Contains('$expectedStart = [DateTime]::Parse([string]$item.StartUtc)')) {
            if (-not $text.Contains($needle)) { throw 'Could not locate stale cleanup insertion point.' }
            $text = $text.Replace($needle, $replacement)
            [System.IO.File]::WriteAllText($path, $text, (New-Object System.Text.UTF8Encoding($false)))
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/ManagerUi.ps1
          git commit -m 'Restore explicit stale start-time validation'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:feature/v1.0.1-hardening
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
