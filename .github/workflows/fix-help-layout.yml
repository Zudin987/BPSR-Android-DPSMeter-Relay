name: Fix Help troubleshooting layout

on:
  push:
    branches:
      - feat/uiux-guided-safe-flow
    paths:
      - .github/workflows/fix-help-layout.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/uiux-guided-safe-flow
      - name: Expand troubleshooting card
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/ManagerUi.ps1')
          s = p.read_text(encoding='utf-8')
          replacements = {
              "$problemHelp = New-UiCard -X 566 -Y 374 -Width 306 -Height 138": "$problemHelp = New-UiCard -X 566 -Y 374 -Width 306 -Height 154",
              "$problemText.Size = New-Object System.Drawing.Size(274, 90)": "$problemText.Size = New-Object System.Drawing.Size(274, 106)",
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit(f'expected one layout anchor: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8', newline='\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-help-layout.yml
          git add scripts/ManagerUi.ps1
          git commit -m "Give troubleshooting guidance enough layout space"
          git push origin HEAD:feat/uiux-guided-safe-flow
