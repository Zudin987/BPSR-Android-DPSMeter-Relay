name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-powershell:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse PowerShell with Windows PowerShell 5.1
        shell: powershell
        run: |
          $paths = @(
            'scripts\LaunchManager.ps1',
            'scripts\BPSRRelayManager.ps1',
            'scripts\ManagerUi.ps1',
            'scripts\ServeProfile.ps1',
            'scripts\TestRelaySmoke.ps1',
            'scripts\BuildRelease.ps1'
          )
          foreach ($relative in $paths) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $relative), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ($relative + ': ' + $_.Message) }
              exit 1
            }
          }
          Write-Host 'PowerShell syntax OK.'

      - name: Check v1.0.2 firewall topology and latency invariants
        shell: powershell
        run: |
          $text = Get-Content 'scripts\BPSRRelayManager.ps1' -Raw
          $ui = Get-Content 'scripts\ManagerUi.ps1' -Raw
          $readme = Get-Content 'README.md' -Raw
          $launcher = Get-Content 'launcher\BPSRRelayManagerLauncher.cs' -Raw
          $builder = Get-Content 'scripts\BuildRelease.ps1' -Raw
          $release = Get-Content '.github\workflows\release.yml' -Raw
          $smoke = Get-Content 'scripts\TestRelaySmoke.ps1' -Raw

          $required = @(
            "`$ManagerVersion = '1.0.2'",
            "`$TestedSingBoxVersion = 'v1.13.19'",
            '$FrontPort = 10808',
            '$InternalPortStart = 18080',
            '$InternalPortEnd = 18180',
            'function Test-FirewallProfileIsPrivate',
            'function Test-FirewallProtocolMatches',
            "'TCP' { @('TCP', '6') }",
            "'UDP' { @('UDP', '17') }",
            'function Test-FirewallLocalSubnetScope',
            'LocalSubnet4',
            'function Test-FirewallReady',
            'Test-FirewallValueContains -Value $port.LocalPort -Expected ([string]$FrontPort)',
            'Test-FirewallValueContains -Value $addr.LocalAddress -Expected $PcIp',
            'Test-FirewallLocalSubnetScope -Value $addr.RemoteAddress',
            '-RemoteAddress LocalSubnet -Profile Private -EdgeTraversalPolicy Block',
            'function Ensure-InternalBridgePortAvailable',
            'function Assert-Topology',
            'function Get-RelayTrackedRunning',
            'function Start-ProfileShare',
            "Join-Path `$Runtime 'BPSRMobileFront.exe'",
            "Join-Path `$Runtime 'StarSEA.exe'",
            "server = '127.0.0.1'",
            "final = 'bpsr-pc'",
            'route_exclude_address',
            "stack = 'system'",
            'Universal DPS meter capture target: StarSEA',
            'Do not target BPSRMobileFront'
          )
          foreach ($needle in $required) {
            if (-not $text.Contains($needle)) { throw ('Missing v1.0.2 invariant: ' + $needle) }
          }

          # The compatibility fix must never broaden the trusted-LAN firewall rule.
          foreach ($needle in @(
            "Test-FirewallProfileIsPrivate -Value 'Any'",
            "Test-FirewallLocalSubnetScope -Value 'Any'"
          )) {
            if (-not $text.Contains($needle)) { throw ('Missing negative firewall regression guard: ' + $needle) }
          }

          # Preserve the field-tested Android -> BPSRMobileFront -> localhost StarSEA topology.
          $writeStart = $text.IndexOf('function Write-RelayConfigs', [System.StringComparison]::Ordinal)
          $writeEnd = $text.IndexOf('function Get-ProfilePcIp', $writeStart, [System.StringComparison]::Ordinal)
          if ($writeStart -lt 0 -or $writeEnd -le $writeStart) { throw 'Could not isolate Write-RelayConfigs.' }
          $writeSegment = $text.Substring($writeStart, $writeEnd - $writeStart)
          foreach ($needle in @("type = 'socks'", "server = '127.0.0.1'", "final = 'bpsr-pc'", 'route_exclude_address')) {
            if (-not $writeSegment.Contains($needle)) { throw ('Relay topology generator is missing: ' + $needle) }
          }
          foreach ($forbidden in @("type = 'shadowsocks'", '2022-blake3-aes-128-gcm', 'BPSRRelayIngress', 'multiplex')) {
            if ($writeSegment.Contains($forbidden)) { throw ('Forbidden transport change found: ' + $forbidden) }
          }
          if ($text.Contains("[ordered]@{ action = 'sniff' }")) { throw 'Protocol sniff action was reintroduced.' }
          if ($text.Contains('strict_route = $true')) { throw 'Unsupported strict_route was reintroduced.' }

          # Phone setup must still require the narrow firewall rule before sharing a profile.
          $shareStart = $text.IndexOf('function Start-ProfileShare', [System.StringComparison]::Ordinal)
          $shareEnd = $text.IndexOf('function Get-ProfileDownloadUrl', $shareStart, [System.StringComparison]::Ordinal)
          if ($shareStart -lt 0 -or $shareEnd -le $shareStart) { throw 'Could not isolate Start-ProfileShare.' }
          $shareSegment = $text.Substring($shareStart, $shareEnd - $shareStart)
          if (-not $shareSegment.Contains('Test-FirewallReady -PcIp $pcIp')) { throw 'Phone setup no longer requires a ready firewall.' }

          # Keep gameplay status polling lightweight.
          $hotStart = $text.IndexOf('function Get-RelayTrackedRunning', [System.StringComparison]::Ordinal)
          $hotEnd = $text.IndexOf('function Start-ProfileShare', $hotStart, [System.StringComparison]::Ordinal)
          if ($hotStart -lt 0 -or $hotEnd -le $hotStart) { throw 'Could not isolate relay hot path.' }
          $hot = $text.Substring($hotStart, $hotEnd - $hotStart)
          foreach ($forbidden in @('Get-FileHash','Get-CimInstance','Read-JsonFile','Get-NetIPConfiguration','Get-NetAdapter','Get-NetTCPConnection','Get-NetUDPEndpoint')) {
            if ($hot.Contains($forbidden)) { throw ('Gameplay hot path regressed to heavy work: ' + $forbidden) }
          }

          if ($text.Contains('New-Object System.Windows.Forms.Form')) { throw 'UI was re-embedded into the relay engine.' }
          foreach ($needle in @('BPSR_RELAY_UI_SELF_TEST','UI SELF-TEST PASS','PC Start Relay  ->  Phone Start SFA  ->  Open BPSR','Never BPSRMobileFront')) {
            if (-not $ui.Contains($needle)) { throw ('UI invariant missing: ' + $needle) }
          }
          foreach ($needle in @('DPS-meter agnostic','authenticated SOCKS5','trusted home/private LAN','BPSR Relay Manager.exe','Prepare Relay','Start Relay')) {
            if (-not $readme.Contains($needle)) { throw ('Documentation invariant missing: ' + $needle) }
          }
          foreach ($needle in @('ProcessStartInfo','powershell.exe','--launcher-self-test','CreateNoWindow = true')) {
            if (-not $launcher.Contains($needle)) { throw ('Launcher invariant missing: ' + $needle) }
          }
          foreach ($forbidden in @('10808','sing-box','StarSEA.exe','BPSRMobileFront.exe')) {
            if ($launcher.Contains($forbidden)) { throw ('Launcher entered relay/network logic: ' + $forbidden) }
          }
          foreach ($needle in @('BPSR Relay Manager.exe','/target:winexe','--launcher-self-test','must contain exactly one executable',"EntryPoint = 'BPSR Relay Manager.exe'")) {
            if (-not $builder.Contains($needle)) { throw ('Package guard missing: ' + $needle) }
          }
          foreach ($needle in @('field_test_passed',"GITHUB_REF_NAME -ne 'main'",'Require green Validate run for exact commit','--commit $env:GITHUB_SHA','BuildRelease.ps1','gh release create','--latest')) {
            if (-not $release.Contains($needle)) { throw ('Stable release guard missing: ' + $needle) }
          }
          foreach ($needle in @('BPSRMobileFront','localhost StarSEA','--proxy-user','--socks5-hostname','V4-COMPAT RELAY SMOKE PASS')) {
            if (-not $smoke.Contains($needle)) { throw ('Relay smoke guard missing: ' + $needle) }
          }

          Write-Host 'Static v1.0.2 firewall/topology/latency/UI/package/release guards passed.'

      - name: Verify Windows TCP and UDP conflict detection primitives
        shell: powershell
        run: |
          $tcp = New-Object System.Net.Sockets.TcpListener([System.Net.IPAddress]::Loopback, 0)
          $udp = $null
          try {
            $tcp.Start()
            $port = [int]$tcp.LocalEndpoint.Port
            $udp = New-Object System.Net.Sockets.UdpClient
            $udp.Client.Bind((New-Object System.Net.IPEndPoint([System.Net.IPAddress]::Loopback, $port)))
            Start-Sleep -Milliseconds 150
            if (@(Get-NetTCPConnection -State Listen -LocalPort $port -ErrorAction SilentlyContinue).Count -eq 0) { throw 'TCP conflict primitive did not detect listener.' }
            if (@(Get-NetUDPEndpoint -LocalPort $port -ErrorAction SilentlyContinue).Count -eq 0) { throw 'UDP conflict primitive did not detect endpoint.' }
            Write-Host ('TCP+UDP conflict detection primitives passed on port ' + $port + '.')
          }
          finally {
            if ($udp) { $udp.Dispose() }
            $tcp.Stop()
          }

      - name: Test manager UI
        shell: powershell
        run: |
          $env:BPSR_RELAY_UI_SELF_TEST = '1'
          try {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\scripts\BPSRRelayManager.ps1'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally { Remove-Item Env:BPSR_RELAY_UI_SELF_TEST -ErrorAction SilentlyContinue }

      - name: Run relay self-test against pinned sing-box
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\scripts\BPSRRelayManager.ps1' -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test two-stage relay path
        shell: powershell
        run: |
          $singBox = Join-Path $env:GITHUB_WORKSPACE '.runtime\sing-box.exe'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\scripts\TestRelaySmoke.ps1' -SingBoxExe $singBox
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and inspect clean release package
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\scripts\BuildRelease.ps1' -OutputDirectory 'dist' -Clean
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $zip = Get-Item '.\dist\BPSR-Android-DPSMeter-Relay.zip'
          $shaFile = Get-Item '.\dist\BPSR-Android-DPSMeter-Relay.zip.sha256'
          if ($zip.Length -le 0 -or $shaFile.Length -le 0) { throw 'Release assets are empty.' }

          $expected = ((Get-Content $shaFile.FullName -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw 'Release ZIP SHA256 file does not match the ZIP.' }

          $extract = Join-Path $env:RUNNER_TEMP 'relay-package'
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $extract -Force
          $root = Join-Path $extract 'BPSR-Android-DPSMeter-Relay'
          foreach ($relative in @(
            'BPSR Relay Manager.exe',
            'README.md',
            'scripts\BPSRRelayManager.ps1',
            'scripts\LaunchManager.ps1',
            'scripts\ManagerUi.ps1',
            'scripts\ServeProfile.ps1'
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $root $relative) -PathType Leaf)) { throw ('Package missing: ' + $relative) }
          }
          if (@(Get-ChildItem -LiteralPath $root -Filter '*.exe' -File -Recurse).Count -ne 1) { throw 'Package must contain exactly one executable.' }
          Write-Host ('Clean release package verified. SHA256=' + $actual)
