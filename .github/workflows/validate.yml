name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse developer PowerShell tooling
        shell: powershell
        run: |
          foreach ($relative in @('scripts\BuildNativeManager.ps1','scripts\BuildRelease.ps1','scripts\TestRelaySmoke.ps1','scripts\ServeProfile.ps1')) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $relative), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error ($relative + ': ' + $_.Message) }; exit 1 }
          }
          Write-Host 'Developer PowerShell tooling syntax OK.'

      - name: Check native architecture and relay invariants
        shell: powershell
        run: |
          $version = Get-Content 'src\BpsrRelayManager\VersionInfo.cs' -Raw
          $program = Get-Content 'src\BpsrRelayManager\Program.cs' -Raw
          $engine = Get-Content 'src\BpsrRelayManager\RelayEngine.cs' -Raw
          $windows = Get-Content 'src\BpsrRelayManager\WindowsIntegration.cs' -Raw
          $windowsTest = Get-Content 'src\BpsrRelayManager\WindowsApiSelfTest.cs' -Raw
          $profile = Get-Content 'src\BpsrRelayManager\ProfileServer.cs' -Raw
          $ui = Get-Content 'src\BpsrRelayManager\MainForm.cs' -Raw
          $builder = Get-Content 'scripts\BuildRelease.ps1' -Raw
          $nativeBuilder = Get-Content 'scripts\BuildNativeManager.ps1' -Raw
          $release = Get-Content '.github\workflows\release.yml' -Raw
          $readme = Get-Content 'README.md' -Raw

          $match = [regex]::Match($version, 'public const string Version\s*=\s*"([^"]+)"')
          if (-not $match.Success -or $match.Groups[1].Value -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'Native manager version is missing or invalid.' }
          $managerVersion = $match.Groups[1].Value

          foreach ($needle in @('public const string TestedSingBoxVersion = "v1.13.19"')) { if (-not $version.Contains($needle)) { throw ('Version invariant missing: ' + $needle) } }
          foreach ($needle in @('public const int FrontPort = 10808','InternalPortStart = 18080','InternalPortEnd = 18180','BPSRMobileFront.exe','StarSEA.exe','route_exclude_address','"bpsr-pc"','"127.0.0.1"','PhoneProfileConfirmed','CreateProfileServer','ValidateGeneratedConfigs','Sha256File')) { if (-not $engine.Contains($needle)) { throw ('Native relay invariant missing: ' + $needle) } }
          foreach ($forbidden in @('2022-blake3-aes-128-gcm','quickchart.io')) { if ($engine.Contains($forbidden) -or $ui.Contains($forbidden) -or $profile.Contains($forbidden)) { throw ('Forbidden native runtime dependency/transport found: ' + $forbidden) } }
          foreach ($needle in @('LocalSubnet','PrivateProfile = 2','HNetCfg.FwPolicy2','HNetCfg.FWRule','MakeNetworkPrivate','runas')) { if (-not $windows.Contains($needle)) { throw ('Native Windows integration invariant missing: ' + $needle) } }
          foreach ($needle in @('GetNetworkCategory','HNetCfg.FwPolicy2','CurrentProfileTypes')) { if (-not $windowsTest.Contains($needle)) { throw ('Read-only Windows API self-test guard missing: ' + $needle) } }
          foreach ($needle in @('MutexName','RestoreEventName','Application.Run(form)','--firewall-helper','--windows-api-self-test','--self-test','--ui-self-test')) { if (-not $program.Contains($needle)) { throw ('Native lifecycle invariant missing: ' + $needle) } }
          if ($program.Contains('powershell.exe') -or $engine.Contains('powershell.exe') -or $ui.Contains('powershell.exe')) { throw 'Native product runtime must not launch PowerShell.' }
          foreach ($needle in @('NotifyIcon','Minimize to Tray','Open BPSR Relay Manager','Stop Relay && Exit','Start Phone Setup','Show SFA QR','Copy SFA Link','StarSEA')) { if (-not $ui.Contains($needle)) { throw ('Native UI/tray invariant missing: ' + $needle) } }
          foreach ($needle in @('TcpListener','android-bpsr-relay.json','sing-box://import-remote-profile','Cache-Control: no-store')) { if (-not $profile.Contains($needle)) { throw ('Native phone setup server invariant missing: ' + $needle) } }
          foreach ($needle in @('/target:winexe','System.Windows.Forms.dll','System.Web.Extensions.dll','Microsoft.CSharp.dll','VersionInfo.cs','WindowsApiSelfTest.cs')) { if (-not $nativeBuilder.Contains($needle)) { throw ('Native build guard missing: ' + $needle) } }
          foreach ($needle in @('Native release package must not ship PowerShell runtime scripts','assets\qrcode.min.js','--ui-self-test','exactly one executable')) { if (-not $builder.Contains($needle)) { throw ('Native package guard missing: ' + $needle) } }
          foreach ($needle in @('field_test_passed','VersionInfo.cs','Require green Validate run for exact commit','BuildNativeManager.ps1','--self-test-root','BuildRelease.ps1','gh release create','--latest')) { if (-not $release.Contains($needle)) { throw ('Native stable release guard missing: ' + $needle) } }
          foreach ($needle in @('DPS-meter agnostic','authenticated SOCKS5','trusted home/private LAN','BPSR Relay Manager.exe','Prepare Relay','Start Relay','generated locally')) { if (-not $readme.Contains($needle)) { throw ('Documentation invariant missing: ' + $needle) } }
          Write-Host ('Native architecture/topology/firewall/tray/package guards passed for manager v' + $managerVersion + '.')

      - name: Build native C# WinForms manager
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\scripts\BuildNativeManager.ps1' -OutputPath '.build\native\BPSR Relay Manager.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test read-only Windows network and firewall APIs
        shell: powershell
        run: |
          & '.\.build\native\BPSR Relay Manager.exe' '--windows-api-self-test'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test native manager UI and tray bootstrap
        shell: powershell
        run: |
          & '.\.build\native\BPSR Relay Manager.exe' '--ui-self-test'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run native relay self-test against pinned sing-box
        shell: powershell
        run: |
          $testRoot = Join-Path $env:GITHUB_WORKSPACE '.native-ci'
          if (Test-Path $testRoot) { Remove-Item $testRoot -Recurse -Force }
          & '.\.build\native\BPSR Relay Manager.exe' '--self-test' '--self-test-root' $testRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path (Join-Path $testRoot '.runtime\sing-box.exe'))) { throw 'Native self-test did not provision the pinned sing-box runtime.' }

      - name: Smoke-test two-stage relay data path
        shell: powershell
        run: |
          $singBox = Join-Path $env:GITHUB_WORKSPACE '.native-ci\.runtime\sing-box.exe'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\scripts\TestRelaySmoke.ps1' -SingBoxExe $singBox
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and inspect clean native release package
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\scripts\BuildRelease.ps1' -OutputDirectory 'dist' -Clean
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = Get-Item '.\dist\BPSR-Android-DPSMeter-Relay.zip'
          $shaFile = Get-Item '.\dist\BPSR-Android-DPSMeter-Relay.zip.sha256'
          if ($zip.Length -le 0 -or $shaFile.Length -le 0) { throw 'Release assets are empty.' }
          $expected = ((Get-Content $shaFile.FullName -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw 'Release ZIP SHA256 file does not match the ZIP.' }
          $extract = Join-Path $env:RUNNER_TEMP 'relay-native-package'
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $extract -Force
          $root = Join-Path $extract 'BPSR-Android-DPSMeter-Relay'
          foreach ($relative in @('BPSR Relay Manager.exe','README.md','assets\qrcode.min.js','assets\LICENSE-qrcodejs.txt')) { if (-not (Test-Path -LiteralPath (Join-Path $root $relative) -PathType Leaf)) { throw ('Package missing: ' + $relative) } }
          if (@(Get-ChildItem -LiteralPath $root -Filter '*.exe' -File -Recurse).Count -ne 1) { throw 'Native package must contain exactly one executable.' }
          if (@(Get-ChildItem -LiteralPath $root -Filter '*.ps1' -File -Recurse).Count -ne 0) { throw 'Native package must not contain PowerShell runtime scripts.' }
          Write-Host ('Clean native release package verified. SHA256=' + $actual)
