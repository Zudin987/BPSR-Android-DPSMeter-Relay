name: Validate

on:
  push:
  pull_request:

jobs:
  windows-powershell:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse PowerShell with Windows PowerShell 5.1
        shell: powershell
        run: |
          $paths = @(
            'scripts\LaunchManager.ps1',
            'scripts\BPSRRelayManager.ps1',
            'scripts\ManagerUi.ps1',
            'scripts\ServeProfile.ps1',
            'scripts\TestRelaySmoke.ps1',
            'scripts\BuildRelease.ps1'
          )
          foreach ($relative in $paths) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $relative), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ($relative + ': ' + $_.Message) }
              exit 1
            }
          }
          Write-Host 'PowerShell syntax OK.'

      - name: Check v1.0.1 topology latency and hardening invariants
        shell: powershell
        run: |
          $text = Get-Content 'scripts\BPSRRelayManager.ps1' -Raw
          $ui = Get-Content 'scripts\ManagerUi.ps1' -Raw
          $readme = Get-Content 'README.md' -Raw
          $bat = Get-Content 'BPSR Relay Manager.bat' -Raw
          $launcher = Get-Content 'launcher\BPSRRelayManagerLauncher.cs' -Raw
          $builder = Get-Content 'scripts\BuildRelease.ps1' -Raw
          $release = Get-Content '.github\workflows\release.yml' -Raw
          $smoke = Get-Content 'scripts\TestRelaySmoke.ps1' -Raw

          $required = @(
            "`$ManagerVersion = '1.0.1'",
            "`$TestedSingBoxVersion = 'v1.13.19'",
            '$FrontPort = 10808',
            '$InternalPortStart = 18080',
            '$InternalPortEnd = 18180',
            '$MaxLogBytes = 2097152',
            'function Rotate-LogIfNeeded',
            'function Ensure-InternalBridgePortAvailable',
            'function Get-ListeningUdpEndpoints',
            'Get-NetUDPEndpoint -LocalPort',
            '[void](Ensure-InternalBridgePortAvailable -PcIp $pcIp)',
            'function Assert-Topology',
            'function Get-PreflightChecks',
            'function Get-DiagnosticsText',
            'function Start-ProfileShare',
            'function Restore-PreviousRuntime',
            'function Load-TrackedRelayIdentity',
            'function Set-TrackedRelayIdentity',
            'function Clear-TrackedRelayIdentity',
            'function Test-ExpectedProcess',
            '$trackedPairHealthy = $starOk -and $frontOk',
            'StartUtc = $startUtc',
            "Join-Path `$Runtime 'BPSRMobileFront.exe'",
            "Join-Path `$Runtime 'StarSEA.exe'",
            "Join-Path `$ConfigDir 'pc-relay-front.json'",
            "Join-Path `$ConfigDir 'pc-relay-back.json'",
            "mode = 'v4-compatible-socks5'",
            "server = '127.0.0.1'",
            "final = 'bpsr-pc'",
            'route_exclude_address',
            "stack = 'system'",
            'Universal DPS meter capture target: StarSEA',
            'Do not target BPSRMobileFront',
            '-Protocol TCP',
            '-Protocol UDP',
            '-RemoteAddress LocalSubnet -Profile Private -EdgeTraversalPolicy Block',
            "if (`$category -eq 'Private')",
            "Join-Path `$PSScriptRoot 'ManagerUi.ps1'"
          )
          foreach ($needle in $required) {
            if (-not $text.Contains($needle)) { throw ('Missing v1.0.1 invariant: ' + $needle) }
          }

          if ($text.Contains('New-Object System.Windows.Forms.Form')) {
            throw 'UI was re-embedded into the latency-sensitive relay engine.'
          }

          # The field-tested Android -> BPSRMobileFront -> localhost StarSEA topology must not change.
          $writeStart = $text.IndexOf('function Write-RelayConfigs', [System.StringComparison]::Ordinal)
          $writeEnd = $text.IndexOf('function Get-ProfilePcIp', $writeStart, [System.StringComparison]::Ordinal)
          if ($writeStart -lt 0 -or $writeEnd -le $writeStart) { throw 'Could not isolate Write-RelayConfigs.' }
          $writeSegment = $text.Substring($writeStart, $writeEnd - $writeStart)
          foreach ($needle in @("type = 'socks'", "server = '127.0.0.1'", "final = 'bpsr-pc'", 'route_exclude_address')) {
            if (-not $writeSegment.Contains($needle)) { throw ('Field-tested topology generator is missing: ' + $needle) }
          }
          foreach ($forbidden in @("type = 'shadowsocks'", '2022-blake3-aes-128-gcm', 'BPSRRelayIngress', 'multiplex')) {
            if ($writeSegment.Contains($forbidden)) { throw ('Forbidden old transport leaked into generated configs: ' + $forbidden) }
          }

          # Phone setup must not start before the Private-LAN firewall is ready.
          $shareStart = $text.IndexOf('function Start-ProfileShare', [System.StringComparison]::Ordinal)
          $shareEnd = $text.IndexOf('function Get-ProfileDownloadUrl', $shareStart, [System.StringComparison]::Ordinal)
          if ($shareStart -lt 0 -or $shareEnd -le $shareStart) { throw 'Could not isolate Start-ProfileShare.' }
          $shareSegment = $text.Substring($shareStart, $shareEnd - $shareStart)
          if (-not $shareSegment.Contains('Test-FirewallReady -PcIp $pcIp')) { throw 'Phone setup no longer requires a ready firewall.' }
          if (-not $shareSegment.Contains('clipboard was busy')) { throw 'Clipboard failure tolerance is missing.' }

          # Gameplay status polling must stay tiny even after hardening.
          $engineHotStart = $text.IndexOf('function Get-RelayTrackedRunning', [System.StringComparison]::Ordinal)
          $engineHotEnd = $text.IndexOf('function Start-ProfileShare', $engineHotStart, [System.StringComparison]::Ordinal)
          if ($engineHotStart -lt 0 -or $engineHotEnd -le $engineHotStart) { throw 'Could not isolate gameplay relay hot path.' }
          $engineHot = $text.Substring($engineHotStart, $engineHotEnd - $engineHotStart)
          foreach ($forbidden in @('Get-FileHash','Get-CimInstance','Read-JsonFile','Get-NetIPConfiguration','Get-NetAdapter','Get-NetTCPConnection','Get-NetUDPEndpoint')) {
            if ($engineHot.Contains($forbidden)) { throw ('Gameplay relay hot path regressed to heavy work: ' + $forbidden) }
          }
          if (($engineHot.Split(@('Get-Process'), [System.StringSplitOptions]::None).Count - 1) -ne 2) {
            throw 'Gameplay relay hot path must check exactly the two tracked relay processes.'
          }

          $uiHotStart = $ui.IndexOf('if (Get-RelayTrackedRunning) {', [System.StringComparison]::Ordinal)
          $uiHotReturn = if ($uiHotStart -ge 0) { $ui.IndexOf('return', $uiHotStart, [System.StringComparison]::Ordinal) } else { -1 }
          if ($uiHotStart -lt 0 -or $uiHotReturn -lt 0) { throw 'Could not isolate UI running-status hot path.' }
          $uiHot = $ui.Substring($uiHotStart, ($uiHotReturn - $uiHotStart + 6))
          foreach ($forbidden in @('Test-RuntimeIntegrity','Test-FirewallReady','Get-ProfilePcIp','Get-LanIPv4Candidates','Get-FileHash','Get-CimInstance','Get-NetUDPEndpoint')) {
            if ($uiHot.Contains($forbidden)) { throw ('Gameplay UI hot path regressed to heavy work: ' + $forbidden) }
          }

          $uiRequired = @(
            "`$homeTab.Text = 'Home'",
            "`$detailsTab.Text = 'Details'",
            "`$helpTab.Text = 'Help'",
            "-Text 'Prepare Relay'",
            "-Text 'Start Relay'",
            "-Text '5. Start & Play'",
            "-Text 'What to do next'",
            "`$helpTitle.Text = 'Simple Help'",
            "`$targetValue.Text = 'StarSEA'",
            'Never BPSRMobileFront',
            '$script:btnPreflight.Enabled = -not $Running',
            '$ProfileReady -and $FirewallReady -and (-not $ForeignRelay)',
            'PC Start Relay  ->  Phone Start SFA  ->  Open BPSR',
            '$existingProfileIp = Get-ProfilePcIp',
            '$expectedStart = [DateTime]::Parse([string]$item.StartUtc)',
            'Phone setup is running, but the QR could not open',
            'BPSR_RELAY_UI_SELF_TEST',
            'UI SELF-TEST PASS'
          )
          foreach ($needle in $uiRequired) {
            if (-not $ui.Contains($needle)) { throw ('Missing v1.0.1 UI invariant: ' + $needle) }
          }

          foreach ($needle in @('DPS-meter agnostic','Any DPS meter that can parse BPSR traffic','Multiple DPS meters','authenticated SOCKS5','trusted home/private LAN','v4-compatible','BPSR Relay Manager.exe','EXE-first','Home','Details','Help','Prepare Relay','Start Relay')) {
            if (-not $readme.Contains($needle)) { throw ('Documentation invariant is missing: ' + $needle) }
          }

          if ($text.Contains("[ordered]@{ action = 'sniff' }")) { throw 'Protocol sniff action was reintroduced.' }
          if ($text.Contains('strict_route = $true')) { throw 'Unsupported SFA strict_route was reintroduced.' }
          if (-not $text.Contains("PSObject.Properties['strict_route']")) { throw 'SFA strict_route absence is no longer enforced.' }
          if (-not $text.Contains('multiplex')) { throw 'Self-test no longer guards against multiplexing.' }

          if (-not $bat.Contains('scripts\LaunchManager.ps1')) { throw 'Repository BAT fallback no longer uses startup wrapper.' }
          foreach ($needle in @('ProcessStartInfo','powershell.exe','--launcher-self-test','CreateNoWindow = true','scripts')) {
            if (-not $launcher.Contains($needle)) { throw ('Launcher invariant missing: ' + $needle) }
          }
          foreach ($forbidden in @('10808','sing-box','StarSEA.exe','BPSRMobileFront.exe')) {
            if ($launcher.Contains($forbidden)) { throw ('Launcher entered relay/network logic: ' + $forbidden) }
          }
          foreach ($needle in @('BPSR Relay Manager.exe','scripts\ManagerUi.ps1','/target:winexe','--launcher-self-test','must contain exactly one executable',"EntryPoint = 'BPSR Relay Manager.exe'")) {
            if (-not $builder.Contains($needle)) { throw ('Package guard missing: ' + $needle) }
          }

          foreach ($needle in @('field_test_passed',"GITHUB_REF_NAME -ne 'main'",'compatible DPS-meter','Require green Validate run for exact commit','--commit $env:GITHUB_SHA','BuildRelease.ps1','cmd.exe /d /c','gh release create')) {
            if (-not $release.Contains($needle)) { throw ('Stable release guard missing: ' + $needle) }
          }
          if ($release.Contains('gh release view $tag --repo ''${{ github.repository }}'' *> $null')) {
            throw 'Known PowerShell gh release-view stderr bug was reintroduced.'
          }
          foreach ($needle in @('BPSRMobileFront','localhost StarSEA','--proxy-user','--socks5-hostname','V4-COMPAT RELAY SMOKE PASS')) {
            if (-not $smoke.Contains($needle)) { throw ('V4-compatible smoke guard missing: ' + $needle) }
          }

          Write-Host 'Static v1.0.1 topology/latency/hardening/UI/package/release guards passed.'

      - name: Verify Windows TCP and UDP conflict detection primitives
        shell: powershell
        run: |
          $tcp = New-Object System.Net.Sockets.TcpListener([System.Net.IPAddress]::Loopback, 0)
          $udp = $null
          try {
            $tcp.Start()
            $port = [int]$tcp.LocalEndpoint.Port
            $udp = New-Object System.Net.Sockets.UdpClient
            $udp.Client.Bind((New-Object System.Net.IPEndPoint([System.Net.IPAddress]::Loopback, $port)))
            Start-Sleep -Milliseconds 150
            if (@(Get-NetTCPConnection -State Listen -LocalPort $port -ErrorAction SilentlyContinue).Count -eq 0) { throw 'TCP conflict primitive did not detect listener.' }
            if (@(Get-NetUDPEndpoint -LocalPort $port -ErrorAction SilentlyContinue).Count -eq 0) { throw 'UDP conflict primitive did not detect endpoint.' }
            Write-Host ('TCP+UDP conflict detection primitives passed on port ' + $port + '.')
          }
          finally {
            if ($udp) { $udp.Dispose() }
            $tcp.Stop()
          }

      - name: Test simple manager UI layout
        shell: powershell
        run: |
          $env:BPSR_RELAY_UI_SELF_TEST = '1'
          try {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\scripts\BPSRRelayManager.ps1'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally { Remove-Item Env:BPSR_RELAY_UI_SELF_TEST -ErrorAction SilentlyContinue }

      - name: Run relay config self-test against pinned sing-box
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\scripts\BPSRRelayManager.ps1' -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test field-tested two-stage relay data path
        shell: powershell
        run: |
          $singBox = Join-Path $env:GITHUB_WORKSPACE '.runtime\sing-box.exe'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\scripts\TestRelaySmoke.ps1' -SingBoxExe $singBox
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test temporary phone profile server
        shell: powershell
        run: |
          function Get-FreeTcpPort {
            $listener = New-Object System.Net.Sockets.TcpListener([System.Net.IPAddress]::Loopback, 0)
            try { $listener.Start(); return [int]$listener.LocalEndpoint.Port }
            finally { $listener.Stop() }
          }
          $profile = Join-Path $env:RUNNER_TEMP 'android-bpsr-relay.json'
          '{"test":true}' | Set-Content -Path $profile -Encoding ASCII
          $token = '0123456789abcdef0123456789abcdef'
          $port = Get-FreeTcpPort
          $args = '-NoProfile -ExecutionPolicy Bypass -File "' + (Join-Path $env:GITHUB_WORKSPACE 'scripts\ServeProfile.ps1') + '"' +
                  ' -BindIp 127.0.0.1 -Port ' + $port + ' -Token ' + $token +
                  ' -ProfilePath "' + $profile + '" -LifetimeSeconds 60'
          $server = Start-Process powershell.exe -ArgumentList $args -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Milliseconds 500
            $server.Refresh()
            if ($server.HasExited) { throw 'Profile server exited before test request.' }
            $base = 'http://127.0.0.1:' + $port + '/' + $token + '/'
            $page = Invoke-WebRequest -Uri $base -UseBasicParsing
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch 'Open in SFA') { throw 'Profile landing page test failed.' }
            $head = Invoke-WebRequest -Uri ($base + 'android-bpsr-relay.json') -Method Head -UseBasicParsing
            if ($head.StatusCode -ne 200) { throw 'Profile HEAD request failed.' }
            $server.Refresh()
            if ($server.HasExited) { throw 'HEAD request incorrectly consumed one-download share.' }
            $download = Invoke-WebRequest -Uri ($base + 'android-bpsr-relay.json') -UseBasicParsing
            if ($download.StatusCode -ne 200 -or $download.Content -notmatch '"test"') { throw 'Profile download test failed.' }
            $server.WaitForExit(5000) | Out-Null
            $server.Refresh()
            if (-not $server.HasExited) { throw 'One-download profile server did not exit.' }
            Write-Host 'Temporary profile server tests passed.'
          }
          finally {
            if ($server) { $server.Refresh(); if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue } }
          }

      - name: Build and verify EXE-first release package
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\scripts\BuildRelease.ps1' -OutputDirectory 'dist' -Clean
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zips = @(Get-ChildItem -LiteralPath '.\dist' -Filter '*.zip' -File)
          $hashes = @(Get-ChildItem -LiteralPath '.\dist' -Filter '*.sha256' -File)
          if ($zips.Count -ne 1 -or $hashes.Count -ne 1) { throw 'Expected exactly one release ZIP and one SHA256 file.' }
          $verify = Join-Path $env:RUNNER_TEMP 'bpsr-release-exe-check'
          if (Test-Path -LiteralPath $verify) { Remove-Item -LiteralPath $verify -Recurse -Force }
          Expand-Archive -LiteralPath $zips[0].FullName -DestinationPath $verify -Force
          $archiveRoot = @(Get-ChildItem -LiteralPath $verify -Directory)[0]
          if (-not $archiveRoot) { throw 'Release ZIP has no package root directory.' }
          $launcherExe = Join-Path $archiveRoot.FullName 'BPSR Relay Manager.exe'
          if (-not (Test-Path -LiteralPath $launcherExe -PathType Leaf)) { throw 'Release ZIP does not expose BPSR Relay Manager.exe.' }
          if (-not (Test-Path -LiteralPath (Join-Path $archiveRoot.FullName 'scripts\ManagerUi.ps1') -PathType Leaf)) { throw 'Release ZIP is missing ManagerUi.ps1.' }
          if (Test-Path -LiteralPath (Join-Path $archiveRoot.FullName 'BPSR Relay Manager.bat')) { throw 'Legacy BAT is exposed in release root.' }
          $exeFiles = @(Get-ChildItem -LiteralPath $archiveRoot.FullName -Filter '*.exe' -File -Recurse)
          if ($exeFiles.Count -ne 1 -or $exeFiles[0].Name -ne 'BPSR Relay Manager.exe') { throw 'Release ZIP must contain exactly one EXE launcher.' }
          foreach ($forbidden in @('sing-box.exe','StarSEA.exe','BPSRMobileFront.exe','relay-credentials.json','pids.json')) {
            if (Get-ChildItem -LiteralPath $archiveRoot.FullName -File -Recurse | Where-Object { $_.Name -eq $forbidden }) { throw ('Release ZIP contains forbidden runtime file: ' + $forbidden) }
          }
          $versionInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($launcherExe)
          if ($versionInfo.ProductName -ne 'BPSR Android DPSMeter Relay') { throw ('Unexpected launcher ProductName: ' + $versionInfo.ProductName) }
          & $launcherExe '--launcher-self-test'
          if ($LASTEXITCODE -ne 0) { throw ('Packaged native launcher self-test failed: ' + $LASTEXITCODE) }
          Write-Host 'EXE-first clean package and launcher probe passed.'

      - name: Upload validated release candidate package
        uses: actions/upload-artifact@v4
        with:
          name: validated-release-candidate
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7
