name: Validate

on:
  push:
  pull_request:

jobs:
  windows-powershell:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse PowerShell with Windows PowerShell 5.1
        shell: powershell
        run: |
          $paths = @(
            'scripts\LaunchManager.ps1',
            'scripts\BPSRRelayManager.ps1',
            'scripts\ServeProfile.ps1',
            'scripts\TestRelaySmoke.ps1',
            'scripts\BuildRelease.ps1'
          )

          foreach ($relative in $paths) {
            $path = Join-Path $env:GITHUB_WORKSPACE $relative
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ((${relative} + ': ') + $_.Message) }
              exit 1
            }
            Write-Host ($relative + ' syntax OK.')
          }

      - name: Check latency, UX and single-count invariants
        shell: powershell
        run: |
          $text = Get-Content 'scripts\BPSRRelayManager.ps1' -Raw
          $readme = Get-Content 'README.md' -Raw
          $bat = Get-Content 'BPSR Relay Manager.bat' -Raw
          $launcher = Get-Content 'launcher\BPSRRelayManagerLauncher.cs' -Raw
          $builder = Get-Content 'scripts\BuildRelease.ps1' -Raw
          $release = Get-Content '.github\workflows\release.yml' -Raw

          $required = @(
            '$TestedSingBoxVersion',
            'v1.13.19',
            '$IngressMethod',
            '2022-blake3-aes-128-gcm',
            '$FrontPort = 10902',
            '15000, 16000, 17000, 18000, 20000, 20001, 21000',
            "type = 'shadowsocks'",
            "network = 'tcp'",
            'route_exclude_address',
            "stack = 'system'",
            'function Assert-Topology',
            'function Get-PreflightChecks',
            'function Get-DiagnosticsText',
            'function Start-ProfileShare',
            'function Restore-PreviousRuntime',
            'function Load-TrackedRelayIdentity',
            'function Set-TrackedRelayIdentity',
            'function Clear-TrackedRelayIdentity',
            'Gameplay hot check: PID + immutable process start time only.',
            'Universal DPS meter capture target: StarSEA',
            'Any compatible DPS meter may independently capture this StarSEA stream.',
            '-ExpectedStartUtc $trackedStart',
            'Not saving ',
            'restored the exact pre-rollback runtime files',
            'Gameplay hot path: once StarSEA is running, status polling must remain tiny.',
            'reread PID JSON',
            'resolve the executable path every timer tick',
            '-RemoteAddress LocalSubnet -Profile Private -EdgeTraversalPolicy Block',
            "if (`$category -eq 'Private')"
          )

          foreach ($needle in $required) {
            if (-not $text.Contains($needle)) {
              Write-Error ('Missing critical relay invariant: ' + $needle)
              exit 1
            }
          }

          foreach ($needle in @('DPS-meter agnostic', 'Any DPS meter that can parse BPSR traffic', 'Multiple DPS meters', 'does not implement that TUN option', 'BPSR Relay Manager.exe', 'EXE-first')) {
            if (-not $readme.Contains($needle)) {
              Write-Error ('Universal DPS/SFA/UX documentation invariant is missing: ' + $needle)
              exit 1
            }
          }

          if ($text.Contains("[ordered]@{ action = 'sniff' }")) {
            Write-Error 'Protocol sniff action was reintroduced into the generated Android path.'
            exit 1
          }

          if ($text.Contains('strict_route = $true')) {
            Write-Error 'Unsupported SFA Android strict_route was reintroduced.'
            exit 1
          }

          if (-not $text.Contains("PSObject.Properties['strict_route']")) {
            Write-Error 'SFA strict_route absence is no longer enforced by topology validation.'
            exit 1
          }

          if (-not $text.Contains('Self-test found multiplexing on the latency path.')) {
            Write-Error 'Self-test no longer guards against multiplexing on the latency path.'
            exit 1
          }

          if ($text.Contains('return Test-ExpectedProcess -ProcessId $script:trackedStarPid')) {
            Write-Error 'Gameplay status polling regressed to repeated executable-path verification.'
            exit 1
          }

          if (-not $bat.Contains('scripts\LaunchManager.ps1')) {
            Write-Error 'Repository BAT fallback no longer uses the startup-error wrapper.'
            exit 1
          }

          foreach ($needle in @('ProcessStartInfo', 'powershell.exe', '--launcher-self-test', 'CreateNoWindow = true', 'scripts')) {
            if (-not $launcher.Contains($needle)) {
              Write-Error ('Native launcher invariant is missing: ' + $needle)
              exit 1
            }
          }
          foreach ($forbidden in @('10902', '2022-blake3-aes-128-gcm', 'sing-box', 'StarSEA.exe')) {
            if ($launcher.Contains($forbidden)) {
              Write-Error ('Native launcher must stay out of relay/network logic; found: ' + $forbidden)
              exit 1
            }
          }

          foreach ($needle in @('BPSR Relay Manager.exe', '/target:winexe', '--launcher-self-test', 'must contain exactly one executable', "EntryPoint = 'BPSR Relay Manager.exe'")) {
            if (-not $builder.Contains($needle)) {
              Write-Error ('EXE-first package guard is missing: ' + $needle)
              exit 1
            }
          }

          foreach ($needle in @('field_test_passed', "GITHUB_REF_NAME -ne 'main'", 'compatible DPS-meter', 'Require green Validate run for exact commit', '--commit $env:GITHUB_SHA', 'BuildRelease.ps1', 'gh release create')) {
            if (-not $release.Contains($needle)) {
              Write-Error ('Stable release guard is missing: ' + $needle)
              exit 1
            }
          }

          Write-Host 'Static latency/single-count/universal-DPS/SFA/EXE-UX/safety/release-gate invariants present.'

      - name: Run relay config self-test against pinned sing-box
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\scripts\BPSRRelayManager.ps1' -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test encrypted relay data path
        shell: powershell
        run: |
          $singBox = Join-Path $env:GITHUB_WORKSPACE '.runtime\sing-box.exe'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\scripts\TestRelaySmoke.ps1' -SingBoxExe $singBox
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test temporary phone profile server
        shell: powershell
        run: |
          function Get-FreeTcpPort {
            $listener = New-Object System.Net.Sockets.TcpListener([System.Net.IPAddress]::Loopback, 0)
            try {
              $listener.Start()
              return [int]$listener.LocalEndpoint.Port
            }
            finally { $listener.Stop() }
          }

          $profile = Join-Path $env:RUNNER_TEMP 'android-bpsr-relay.json'
          '{"test":true}' | Set-Content -Path $profile -Encoding ASCII
          $token = '0123456789abcdef0123456789abcdef'
          $port = Get-FreeTcpPort
          $args = '-NoProfile -ExecutionPolicy Bypass -File "' + (Join-Path $env:GITHUB_WORKSPACE 'scripts\ServeProfile.ps1') + '"' +
                  ' -BindIp 127.0.0.1 -Port ' + $port +
                  ' -Token ' + $token +
                  ' -ProfilePath "' + $profile + '" -LifetimeSeconds 60'
          $server = Start-Process powershell.exe -ArgumentList $args -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Milliseconds 500
            $server.Refresh()
            if ($server.HasExited) { throw 'Profile server exited before test request.' }

            $base = 'http://127.0.0.1:' + $port + '/' + $token + '/'
            $page = Invoke-WebRequest -Uri $base -UseBasicParsing
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch 'Download SFA profile') {
              throw 'Profile landing page test failed.'
            }

            $badWas404 = $false
            try {
              Invoke-WebRequest -Uri ('http://127.0.0.1:' + $port + '/ffffffffffffffffffffffffffffffff/') -UseBasicParsing | Out-Null
            }
            catch {
              if ($_.Exception.Response -and [int]$_.Exception.Response.StatusCode -eq 404) { $badWas404 = $true }
            }
            if (-not $badWas404) { throw 'Wrong-token profile request was not rejected with 404.' }

            $head = Invoke-WebRequest -Uri ($base + 'android-bpsr-relay.json') -Method Head -UseBasicParsing
            if ($head.StatusCode -ne 200) { throw 'Profile HEAD request failed.' }
            $server.Refresh()
            if ($server.HasExited) { throw 'HEAD request incorrectly consumed the one-download profile share.' }

            $download = Invoke-WebRequest -Uri ($base + 'android-bpsr-relay.json') -UseBasicParsing
            if ($download.StatusCode -ne 200 -or $download.Content -notmatch '"test"') {
              throw 'Profile download test failed.'
            }

            $server.WaitForExit(5000) | Out-Null
            $server.Refresh()
            if (-not $server.HasExited) { throw 'One-download profile server did not exit.' }
            Write-Host 'Temporary profile server tests passed.'
          }
          finally {
            if ($server) {
              $server.Refresh()
              if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue }
            }
          }

      - name: Build and verify EXE-first release package
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\scripts\BuildRelease.ps1' -OutputDirectory 'dist' -Clean
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $zips = @(Get-ChildItem -LiteralPath '.\dist' -Filter '*.zip' -File)
          $hashes = @(Get-ChildItem -LiteralPath '.\dist' -Filter '*.sha256' -File)
          if ($zips.Count -ne 1 -or $hashes.Count -ne 1) {
            throw 'Expected exactly one release ZIP and one SHA256 file.'
          }

          $verify = Join-Path $env:RUNNER_TEMP 'bpsr-release-exe-check'
          if (Test-Path -LiteralPath $verify) { Remove-Item -LiteralPath $verify -Recurse -Force }
          Expand-Archive -LiteralPath $zips[0].FullName -DestinationPath $verify -Force
          $archiveRoot = @(Get-ChildItem -LiteralPath $verify -Directory)[0]
          if (-not $archiveRoot) { throw 'Release ZIP has no package root directory.' }

          $launcherExe = Join-Path $archiveRoot.FullName 'BPSR Relay Manager.exe'
          if (-not (Test-Path -LiteralPath $launcherExe -PathType Leaf)) {
            throw 'Release ZIP does not expose BPSR Relay Manager.exe as the user entry point.'
          }
          if (Test-Path -LiteralPath (Join-Path $archiveRoot.FullName 'BPSR Relay Manager.bat')) {
            throw 'Legacy BAT is still exposed as a release-package root entry point.'
          }

          $exeFiles = @(Get-ChildItem -LiteralPath $archiveRoot.FullName -Filter '*.exe' -File -Recurse)
          if ($exeFiles.Count -ne 1 -or $exeFiles[0].Name -ne 'BPSR Relay Manager.exe') {
            throw ('Release ZIP must contain exactly one EXE launcher; found: ' + (($exeFiles.FullName) -join ', '))
          }

          $versionInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($launcherExe)
          if ($versionInfo.ProductName -ne 'BPSR Android DPSMeter Relay') {
            throw ('Unexpected launcher ProductName: ' + $versionInfo.ProductName)
          }

          & $launcherExe '--launcher-self-test'
          if ($LASTEXITCODE -ne 0) {
            throw ('Packaged native launcher self-test failed: ' + $LASTEXITCODE)
          }
          Write-Host 'EXE-first package and native launcher probe passed.'

      - name: Upload validated release candidate package
        uses: actions/upload-artifact@v4
        with:
          name: validated-release-candidate
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7
