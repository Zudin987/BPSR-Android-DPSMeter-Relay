name: PR25 One-Time Source Fix

on:
  push:
    paths:
      - .github/workflows/pr25-finalize-once.yml

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.ref == 'refs/heads/fix/performance-functionality-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preserve phone confirmation and remove one-time workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/BpsrRelayManager/RelayEngine.cs')
          source = path.read_text(encoding='utf-8')
          start = source.index('public void MarkPhoneProfileDownloaded()')
          end = source.index('public bool RuntimeReady(', start)
          block = source[start:end]
          original = 'if (string.IsNullOrWhiteSpace(id)) return;'
          replacement = 'if (string.IsNullOrWhiteSpace(id) || PhoneProfileConfirmed()) return;'
          if block.count(original) != 1:
              raise RuntimeError('Expected exactly one download confirmation guard')
          block = block.replace(original, replacement, 1)
          path.write_text(source[:start] + block + source[end:], encoding='utf-8')
          PY
          git rm .github/workflows/pr25-finalize-once.yml
          git add src/BpsrRelayManager/RelayEngine.cs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: preserve confirmed SFA import on repeat download"
          git push origin HEAD:fix/performance-functionality-audit
