name: Fix RC13 Problem Help

on:
  push:
    branches:
      - feature/user-friendly-manager
    paths:
      - .github/workflows/fix-rc13-problem-help.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/user-friendly-manager
          fetch-depth: 0
      - name: Shorten common problem text
        shell: python
        run: |
          from pathlib import Path
          p = Path('scripts/ManagerUi.ps1')
          s = p.read_text(encoding='utf-8')
          old = '$problemText.Text = "Old relay: let the app close it.`r`n`r`nPhone cannot connect: same Wi-Fi + Allow Firewall.`r`n`r`nNo DPS: use StarSEA."'
          new = '$problemText.Text = "Old relay: choose Yes to close.`r`n`r`nPhone issue: same Wi-Fi + Firewall.`r`n`r`nNo DPS: use StarSEA."'
          if s.count(old) != 1:
              raise SystemExit(f'Expected one problem-help text, found {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8', newline='\n')
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/ManagerUi.ps1
          git commit -m 'Shorten RC13 common-problem help text'
          git push origin HEAD:feature/user-friendly-manager
