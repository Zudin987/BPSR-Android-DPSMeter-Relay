name: Fix guided UI clipping

on:
  push:
    branches:
      - feat/ux-guided-misuse-guardrails
    paths:
      - .github/workflows/fix-ui-clipping.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ux-guided-misuse-guardrails
          fetch-depth: 0
      - name: Tighten network hint copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/ManagerUi.ps1')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'Choose the PC network shared with your phone.`r`nUsually Wi-Fi or Ethernet.': 'Phone + PC: same router/network.`r`nChoose Wi-Fi or Ethernet.',
              'Phone must be on the same router/network.': 'Phone must use the same router/network.',
          }
          for old, new in replacements.items():
              count = s.count(old)
              if count < 1:
                  raise SystemExit(f'missing UI copy: {old}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8', newline='\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-ui-clipping.yml
          git add scripts/ManagerUi.ps1
          git commit -m "Fix guided network hint clipping"
          git push origin HEAD:feat/ux-guided-misuse-guardrails
