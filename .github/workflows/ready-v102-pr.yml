name: Ready v1.0.2 PR

on:
  push:
    branches:
      - fix/firewall-verification-v1.0.2

permissions:
  pull-requests: write
  contents: read

jobs:
  ready:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Mark PR 6 ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 6 --repo '${{ github.repository }}'
