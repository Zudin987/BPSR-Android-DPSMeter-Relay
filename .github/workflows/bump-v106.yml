name: Bump v1.0.6

on:
  push:
    branches:
      - release/v1.0.6
    paths:
      - .github/workflows/bump-v106.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.6
      - name: Bump manager version and remove helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/BPSRRelayManager.ps1')
          text = path.read_text(encoding='utf-8')
          old = "$ManagerVersion = '1.0.5'"
          new = "$ManagerVersion = '1.0.6'"
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one v1.0.5 ManagerVersion line.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          rm .github/workflows/bump-v106.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/BPSRRelayManager.ps1 .github/workflows/bump-v106.yml
          git commit -m "Prepare v1.0.6 release"
          git push origin HEAD:release/v1.0.6
