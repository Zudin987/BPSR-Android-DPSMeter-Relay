name: Prepare v1.0.3

on:
  push:
    branches:
      - release/v1.0.3
    paths:
      - .github/workflows/prepare-v103.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.3
          fetch-depth: 0
      - name: Bump stable source version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/BPSRRelayManager.ps1')
          text = p.read_text(encoding='utf-8')
          old = "$ManagerVersion = '1.0.2'"
          new = "$ManagerVersion = '1.0.3'"
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one ManagerVersion 1.0.2 line')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/BPSRRelayManager.ps1
          git commit -m "Bump relay manager to v1.0.3"
          git push origin HEAD:release/v1.0.3
