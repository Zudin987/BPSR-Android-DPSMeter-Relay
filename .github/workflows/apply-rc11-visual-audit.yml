name: Apply RC11 Visual Audit

on:
  push:
    branches:
      - feature/user-friendly-manager
    paths:
      - '.github/workflows/apply-rc11-visual-audit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/user-friendly-manager

      - name: Apply visual audit support
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\scripts\ApplyRc11VisualAudit.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Parse changed PowerShell
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\scripts\ManagerUi.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'UI syntax OK.'

      - name: Commit visual audit support
        shell: powershell
        run: |
          git config user.name "MrEz"
          git config user.email "39240221+Zudin987@users.noreply.github.com"
          git add -- 'scripts/ManagerUi.ps1' '.github/workflows/validate.yml'
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (git diff --cached --quiet)) {
            git commit -m "Add rendered UI previews to RC11 validation"
            git push origin HEAD:feature/user-friendly-manager
          }
