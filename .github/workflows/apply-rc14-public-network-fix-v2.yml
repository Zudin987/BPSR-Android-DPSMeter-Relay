name: Apply RC14 Public Network Fix v2

on:
  push:
    branches:
      - feature/user-friendly-manager
    paths:
      - .github/workflows/apply-rc14-public-network-fix-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/user-friendly-manager
          fetch-depth: 0

      - name: Apply RC14 firewall and UI fix
        shell: python
        run: |
          from pathlib import Path

          def replace_one(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match in {path}, found {n}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          engine = 'scripts/BPSRRelayManager.ps1'
          ui = 'scripts/ManagerUi.ps1'

          replace_one(engine, "$ManagerVersion = '1.0.0-rc.13'", "$ManagerVersion = '1.0.0-rc.14'", 'version')

          replace_one(
              engine,
              "function Test-FirewallReady {\n    param([string]$PcIp)\n    try {",
              "function Test-FirewallReady {\n    param([string]$PcIp)\n    if ((Get-NetworkCategoryForIp -Address $PcIp) -ne 'Private') { return $false }\n    try {",
              'firewall active-profile check'
          )

          old_allow = '''function Allow-Firewall {
              $pcIp = Get-SelectedIp
              Ensure-Directories
              $body = @"
          `$ErrorActionPreference = 'Stop'
          `$display = '$FirewallRuleName'
          Get-NetFirewallRule -DisplayName `$display -ErrorAction SilentlyContinue | Remove-NetFirewallRule -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName `$display -Direction Inbound -Action Allow -Protocol TCP -LocalPort $FrontPort -LocalAddress '$pcIp' -RemoteAddress LocalSubnet -Profile Private -EdgeTraversalPolicy Block | Out-Null
          "@
              Write-Utf8NoBom -Path $FirewallScript -Text $body

              Add-Log ('Requesting Administrator permission for the LAN-only firewall rule on ' + $pcIp + ':' + $FrontPort + '...')
              $args = '-NoProfile -ExecutionPolicy Bypass -File ' + (Quote-Argument $FirewallScript)
              $process = Start-Process -FilePath 'powershell.exe' -Verb RunAs -Wait -PassThru -ArgumentList $args
              if ($process.ExitCode -ne 0) { throw ('Firewall setup failed with exit code ' + $process.ExitCode + '.') }
              Add-Log 'Firewall ready: Private profile, selected local IP only, LocalSubnet remote only.'
              Update-Status
          }
          '''
          # YAML indentation is stripped before Python executes; normalize the source block explicitly.
          old_allow = '\n'.join(line[10:] if line.startswith('          ') else line for line in old_allow.split('\n'))

          new_allow = '''function Allow-Firewall {
              $pcIp = Get-SelectedIp
              $adapter = Get-InterfaceForIp -Address $pcIp
              if (-not $adapter) { throw 'Could not find the selected Windows network adapter.' }

              $category = Get-NetworkCategoryForIp -Address $pcIp
              if ($category -eq 'Public') {
                  $choice = [System.Windows.Forms.MessageBox]::Show(
                      "This Windows network is Public.`r`n`r`nThe relay only opens on a Private LAN for safety.`r`n`r`nOnly continue if this is your trusted home/private network.`r`n`r`nChange it to Private and allow your phone to connect?",
                      'Trusted network required',
                      [System.Windows.Forms.MessageBoxButtons]::YesNo,
                      [System.Windows.Forms.MessageBoxIcon]::Warning
                  )
                  if ($choice -ne [System.Windows.Forms.DialogResult]::Yes) {
                      Add-Log 'Firewall setup cancelled because the active network is Public.'
                      Update-Status
                      return
                  }
              }
              elseif ($category -ne 'Private') {
                  throw ('Windows network profile is ' + $category + '. The relay requires a Private network profile.')
              }

              Ensure-Directories
              $profileCommand = ''
              if ($category -eq 'Public') {
                  $profileCommand = 'Set-NetConnectionProfile -InterfaceIndex ' + [int]$adapter.InterfaceIndex + ' -NetworkCategory Private' + [Environment]::NewLine
              }
              $body = @"
          `$ErrorActionPreference = 'Stop'
          `$display = '$FirewallRuleName'
          $profileCommand`nGet-NetFirewallRule -DisplayName `$display -ErrorAction SilentlyContinue | Remove-NetFirewallRule -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName `$display -Direction Inbound -Action Allow -Protocol TCP -LocalPort $FrontPort -LocalAddress '$pcIp' -RemoteAddress LocalSubnet -Profile Private -EdgeTraversalPolicy Block | Out-Null
          "@
              Write-Utf8NoBom -Path $FirewallScript -Text $body

              Add-Log ('Requesting Administrator permission for the trusted-LAN firewall rule on ' + $pcIp + ':' + $FrontPort + '...')
              $args = '-NoProfile -ExecutionPolicy Bypass -File ' + (Quote-Argument $FirewallScript)
              $process = Start-Process -FilePath 'powershell.exe' -Verb RunAs -Wait -PassThru -ArgumentList $args
              if ($process.ExitCode -ne 0) { throw ('Firewall setup failed with exit code ' + $process.ExitCode + '.') }

              $newCategory = Get-NetworkCategoryForIp -Address $pcIp
              if ($newCategory -ne 'Private') {
                  throw ('Windows network is still ' + $newCategory + '. Change this trusted network to Private, then try again.')
              }
              if (-not (Test-FirewallReady -PcIp $pcIp)) {
                  throw 'The Private-network firewall rule could not be verified after setup.'
              }

              Add-Log 'Firewall ready: active network is Private; selected local IP only; LocalSubnet remote only.'
              Update-Status
          }
          '''
          new_allow = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_allow.split('\n'))
          replace_one(engine, old_allow, new_allow, 'Allow-Firewall')

          old_preflight = """    if (Test-FirewallReady -PcIp $PcIp) { Add-CheckLocal 'Firewall' 'OK' 'LAN-only Private-profile rule found.' }
              else { Add-CheckLocal 'Firewall' 'WARN' 'Expected narrow Private-profile manager firewall rule was not found for this IP.' }

              $category = Get-NetworkCategoryForIp -Address $PcIp
              if ($category -eq 'Private') { Add-CheckLocal 'Windows network profile' 'OK' $category }
              else { Add-CheckLocal 'Windows network profile' 'WARN' ('Current category: ' + $category + '. The manager firewall rule is intentionally Private-only.') }
          """
          old_preflight = '\n'.join(line[4:] if line.startswith('    ') else line for line in old_preflight.split('\n'))
          new_preflight = """    $category = Get-NetworkCategoryForIp -Address $PcIp
              if ($category -eq 'Private') {
                  Add-CheckLocal 'Windows network profile' 'OK' 'Private'
                  if (Test-FirewallReady -PcIp $PcIp) { Add-CheckLocal 'Firewall' 'OK' 'LAN-only Private-profile rule is active.' }
                  else { Add-CheckLocal 'Firewall' 'FAIL' 'Private network is selected, but the relay firewall rule is missing or does not match this IP.' }
              }
              elseif ($category -eq 'Public') {
                  Add-CheckLocal 'Windows network profile' 'FAIL' 'Current category: Public. Click Allow Firewall and approve changing this trusted LAN to Private.'
                  Add-CheckLocal 'Firewall' 'FAIL' 'The safe Private-only firewall rule cannot apply while this network is Public.'
              }
              else {
                  Add-CheckLocal 'Windows network profile' 'FAIL' ('Current category: ' + $category + '. The relay requires a Private network profile.')
                  Add-CheckLocal 'Firewall' 'FAIL' 'The Private-only relay firewall rule is not active on this network profile.'
              }
          """
          new_preflight = '\n'.join(line[4:] if line.startswith('    ') else line for line in new_preflight.split('\n'))
          replace_one(engine, old_preflight, new_preflight, 'preflight network/firewall')

          replace_one(
              engine,
              "    $firewall = if (-not [string]::IsNullOrWhiteSpace($pcIp) -and (Test-FirewallReady -PcIp $pcIp)) { 'OK' } else { 'not detected / mismatch' }\n    $topology = 'NOT CHECKED'",
              "    $networkCategory = if (-not [string]::IsNullOrWhiteSpace($pcIp)) { Get-NetworkCategoryForIp -Address $pcIp } else { 'unknown' }\n    $firewall = if ($networkCategory -eq 'Public') {\n        'BLOCKED - Windows network is Public; click Allow Firewall to change this trusted LAN to Private'\n    }\n    elseif (-not [string]::IsNullOrWhiteSpace($pcIp) -and (Test-FirewallReady -PcIp $pcIp)) { 'OK - active on Private network' }\n    else { 'not active / mismatch' }\n    $topology = 'NOT CHECKED'",
              'diagnostic firewall state'
          )
          replace_one(
              engine,
              "Windows network category: $(if ($pcIp) { Get-NetworkCategoryForIp -Address $pcIp } else { 'unknown' })",
              "Windows network category: $networkCategory",
              'diagnostic network category'
          )

          replace_one(
              engine,
              "    Write-Host ('Pinned sing-box: ' + $TestedSingBoxVersion)\n    Ensure-TestedSingBox",
              "    Write-Host ('Pinned sing-box: ' + $TestedSingBoxVersion)\n    $sourceText = Get-Content -LiteralPath $PSCommandPath -Raw\n    if ($sourceText -notmatch 'Set-NetConnectionProfile') { throw 'Self-test found missing Public-to-Private network repair path.' }\n    if ($sourceText -notmatch \"Windows network profile' 'FAIL'\") { throw 'Self-test found missing blocking network-profile preflight.' }\n    Ensure-TestedSingBox",
              'self-test guards'
          )

          # UI: simple line/block replacements copied from the exact RC13 source.
          replace_one(
              ui,
              "        'firewall|administrator|access is denied|elevation' {\n            return \"Windows could not allow the phone connection.`r`n`r`nClick Allow Firewall again and approve the Windows message.\"\n        }",
              "        'network.*Public|network profile|NetworkCategory' {\n            return \"This Windows network is not Private yet.`r`n`r`nClick Allow Firewall and approve changing your trusted home/private network to Private.\"\n        }\n        'firewall|administrator|access is denied|elevation' {\n            return \"Windows could not allow the phone connection.`r`n`r`nClick Allow Firewall again and approve the Windows message.\"\n        }",
              'friendly network error'
          )

          replace_one(
              ui,
              "    elseif ($names -match 'LAN IP') {\n        $message = \"This PC address is not ready.`r`n`r`nChoose the current address and try again.\"\n    }\n    else {",
              "    elseif ($names -match 'LAN IP') {\n        $message = \"This PC address is not ready.`r`n`r`nChoose the current address and try again.\"\n    }\n    elseif ($names -match 'Windows network profile|Firewall') {\n        $message = \"Your Windows network is not ready for the phone connection.`r`n`r`nClick Allow Firewall. If this is your trusted home/private network, approve changing it to Private.\"\n    }\n    else {",
              'friendly preflight network failure'
          )

          replace_one(
              ui,
              "        [bool]$ForeignRelay = $false\n    )",
              "        [bool]$ForeignRelay = $false,\n        [bool]$FirewallReady = $false\n    )",
              'button-state firewall parameter'
          )
          replace_one(
              ui,
              "    if ($script:btnStart)       { $script:btnStart.Enabled = (-not $Running) -and $RuntimeReady -and $ProfileReady -and (-not $ForeignRelay) }",
              "    if ($script:btnStart)       { $script:btnStart.Enabled = (-not $Running) -and $RuntimeReady -and $ProfileReady -and $FirewallReady -and (-not $ForeignRelay) }",
              'Start button firewall gate'
          )

          old_status = """    $firewallReady = $false
              if (-not [string]::IsNullOrWhiteSpace($selected)) {
                  try { $firewallReady = Test-FirewallReady -PcIp $selected } catch {}
              }
              if ($firewallReady) {
                  Set-UiStatusLabel -Label $script:lblFirewallState -Text 'Ready' -State 'Ready'
              }
              else {
                  Set-UiStatusLabel -Label $script:lblFirewallState -Text 'Not set' -State 'Warning'
              }
          """
          old_status = '\n'.join(line[4:] if line.startswith('    ') else line for line in old_status.split('\n'))
          new_status = """    $firewallReady = $false
              $networkCategory = 'Unknown'
              if (-not [string]::IsNullOrWhiteSpace($selected)) {
                  try {
                      $networkCategory = Get-NetworkCategoryForIp -Address $selected
                      $firewallReady = Test-FirewallReady -PcIp $selected
                  }
                  catch {}
              }
              if ($firewallReady) {
                  Set-UiStatusLabel -Label $script:lblFirewallState -Text 'Ready' -State 'Ready'
              }
              elseif ($networkCategory -eq 'Public') {
                  Set-UiStatusLabel -Label $script:lblFirewallState -Text 'Network is Public' -State 'Error'
              }
              else {
                  Set-UiStatusLabel -Label $script:lblFirewallState -Text 'Not set' -State 'Warning'
              }
          """
          new_status = '\n'.join(line[4:] if line.startswith('    ') else line for line in new_status.split('\n'))
          replace_one(ui, old_status, new_status, 'UI firewall status')

          replace_one(
              ui,
              "    elseif (-not $firewallReady) {\n        $script:lblNextAction.Text = 'Click Allow Firewall so your phone can connect.'\n    }",
              "    elseif (-not $firewallReady) {\n        if ($networkCategory -eq 'Public') {\n            $script:lblNextAction.Text = 'Network is Public. Click Allow Firewall and approve Private only on your trusted LAN.'\n        }\n        else {\n            $script:lblNextAction.Text = 'Click Allow Firewall so your phone can connect.'\n        }\n    }",
              'next action Public network'
          )
          replace_one(
              ui,
              "    Update-UiButtonStates -Running $false -ProfileReady $profileReady -RuntimeReady $runtimeReady -ForeignRelay $foreign",
              "    Update-UiButtonStates -Running $false -ProfileReady $profileReady -RuntimeReady $runtimeReady -ForeignRelay $foreign -FirewallReady $firewallReady",
              'button state call'
          )

          # README candidate/version and one clear troubleshooting note.
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('v1.0.0-rc.13', 'v1.0.0-rc.14')
          if 'Windows network is Public' not in text:
              text += "\n\n### Windows network says Public\nClick **Allow Firewall**. Only approve changing the network to **Private** when this is your trusted home/private LAN. The relay stays blocked on Public networks.\n"
          p.write_text(text, encoding='utf-8', newline='\n')

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq "1.0.0-rc.14" scripts/BPSRRelayManager.ps1
          grep -Fq "Set-NetConnectionProfile" scripts/BPSRRelayManager.ps1
          grep -Fq "Current category: Public" scripts/BPSRRelayManager.ps1
          grep -Fq "Network is Public" scripts/ManagerUi.ps1
          grep -Fq "FirewallReady" scripts/ManagerUi.ps1
          grep -Fq "BLOCKED - Windows network is Public" scripts/BPSRRelayManager.ps1

      - name: Commit RC14
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/BPSRRelayManager.ps1 scripts/ManagerUi.ps1 README.md
          git commit -m 'Fix Public network firewall false-ready state'
          git push origin HEAD:feature/user-friendly-manager
