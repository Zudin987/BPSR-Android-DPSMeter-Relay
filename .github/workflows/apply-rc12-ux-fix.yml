name: Apply RC12 UX Fix

on:
  push:
    branches:
      - feature/user-friendly-manager
    paths:
      - '.github/workflows/apply-rc12-ux-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/user-friendly-manager

      - name: Apply RC12 UX patch
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\scripts\ApplyRc12UxFixSafe.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Parse changed PowerShell
        shell: powershell
        run: |
          foreach ($path in @('.\scripts\BPSRRelayManager.ps1', '.\scripts\ManagerUi.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ($path + ': ' + $_.Message) }
              exit 1
            }
          }
          Write-Host 'RC.12 syntax OK.'

      - name: Run UI self-test
        shell: powershell
        run: |
          $env:BPSR_RELAY_UI_SELF_TEST = '1'
          try {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\scripts\BPSRRelayManager.ps1'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Remove-Item Env:BPSR_RELAY_UI_SELF_TEST -ErrorAction SilentlyContinue
          }

      - name: Commit RC12
        shell: powershell
        run: |
          git config user.name "MrEz"
          git config user.email "39240221+Zudin987@users.noreply.github.com"
          git add -- 'scripts/BPSRRelayManager.ps1' 'scripts/ManagerUi.ps1'
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (git diff --cached --quiet)) {
            git commit -m "Improve old-relay recovery and setup button UX"
            git push origin HEAD:feature/user-friendly-manager
          }
