name: Apply RC10 UI Wiring

on:
  push:
    branches:
      - feature/user-friendly-manager
    paths:
      - '.github/workflows/apply-rc10-wiring.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/user-friendly-manager

      - name: Apply exact RC10 manager wiring
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\scripts\ApplyRc10Wiring.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Parse engine and UI
        shell: powershell
        run: |
          foreach ($path in @('.\scripts\BPSRRelayManager.ps1', '.\scripts\ManagerUi.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ($path + ': ' + $_.Message) }
              exit 1
            }
          }
          Write-Host 'Engine and UI syntax OK.'

      - name: Commit engine wiring
        shell: powershell
        run: |
          git config user.name "MrEz"
          git config user.email "39240221+Zudin987@users.noreply.github.com"
          git add -- 'scripts/BPSRRelayManager.ps1'
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (git diff --cached --quiet)) {
            git commit -m "Wire RC10 simple UI module"
            git push origin HEAD:feature/user-friendly-manager
          }
