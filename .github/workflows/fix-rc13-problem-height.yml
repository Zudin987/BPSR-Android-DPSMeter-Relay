name: Fix RC13 Problem Height

on:
  push:
    branches:
      - feature/user-friendly-manager
    paths:
      - .github/workflows/fix-rc13-problem-height.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/user-friendly-manager
          fetch-depth: 0
      - name: Give common-problem text enough room
        shell: python
        run: |
          from pathlib import Path
          p = Path('scripts/ManagerUi.ps1')
          s = p.read_text(encoding='utf-8')
          old = '$problemText.Size = New-Object System.Drawing.Size(274, 82)'
          new = '$problemText.Size = New-Object System.Drawing.Size(274, 90)'
          if s.count(old) != 1:
              raise SystemExit(f'Expected one problem text size, found {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8', newline='\n')
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/ManagerUi.ps1
          git commit -m 'Fix RC13 common-problem text fit'
          git push origin HEAD:feature/user-friendly-manager
