name: Apply RC14 Public Network Fix v4

on:
  push:
    branches:
      - feature/user-friendly-manager
    paths:
      - .github/workflows/apply-rc14-public-network-fix-v4.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/user-friendly-manager
          fetch-depth: 0

      - name: Reuse validated RC14 patch logic
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/apply-rc14-public-network-fix-v3.yml').read_text(encoding='utf-8')
          anchor = '      - name: Apply RC14 fix robustly\n'
          start = workflow.index(anchor)
          run_marker = '        run: |\n'
          code_start = workflow.index(run_marker, start) + len(run_marker)
          code_end = workflow.index('\n      - name: Verify patch', code_start)
          raw = workflow[code_start:code_end]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in raw.split('\n'))
          exec(compile(code, 'rc14-v3-embedded.py', 'exec'), {})

          # Keep source clean even if a replacement template carried a trailing space.
          for name in ['scripts/BPSRRelayManager.ps1', 'scripts/ManagerUi.ps1', 'README.md']:
              p = Path(name)
              lines = p.read_text(encoding='utf-8').splitlines()
              p.write_text('\n'.join(line.rstrip() for line in lines) + '\n', encoding='utf-8', newline='\n')

      - name: Verify RC14 patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq "1.0.0-rc.14" scripts/BPSRRelayManager.ps1
          grep -Fq "Set-NetConnectionProfile" scripts/BPSRRelayManager.ps1
          grep -Fq "Current category: Public" scripts/BPSRRelayManager.ps1
          grep -Fq "BLOCKED - Windows network is Public" scripts/BPSRRelayManager.ps1
          grep -Fq "Network is Public" scripts/ManagerUi.ps1
          grep -Fq 'FirewallReady' scripts/ManagerUi.ps1

      - name: Commit RC14
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/BPSRRelayManager.ps1 scripts/ManagerUi.ps1 README.md
          git commit -m 'Fix Public network firewall false-ready state'
          git push origin HEAD:feature/user-friendly-manager
