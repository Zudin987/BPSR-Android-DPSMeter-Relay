name: Apply guided UI UX safety audit

on:
  push:
    branches:
      - feat/uiux-guided-safe-flow
    paths:
      - .github/workflows/apply-uiux-guided-flow.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/uiux-guided-safe-flow
          fetch-depth: 0
      - name: Apply audited changes
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path(".github/scripts/apply_uiux.py"); s=p.read_text(); s=s.replace("            '\'' -ProfilePath '\'' + (Quote-Argument $AndroidConfig) + '\'' -LifetimeSeconds '\'' + $ShareLifetimeSeconds", "            '\'' -ProfilePath '\'' + (Quote-Argument $AndroidConfig) + \\n            '\'' -LifetimeSeconds '\'' + $ShareLifetimeSeconds"); p.write_text(s)'
          python3 .github/scripts/apply_uiux.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-uiux-guided-flow.yml .github/scripts/apply_uiux.py
          git add scripts/BPSRRelayManager.ps1 scripts/ManagerUi.ps1 scripts/ServeProfile.ps1
          git commit -m "Guide relay setup and prevent common UX mistakes"
          git push origin HEAD:feat/uiux-guided-safe-flow
