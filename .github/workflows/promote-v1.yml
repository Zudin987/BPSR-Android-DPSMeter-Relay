name: Promote v1 Source

on:
  push:
    branches:
      - feature/user-friendly-manager
    paths:
      - .github/workflows/promote-v1.yml

permissions:
  contents: write

jobs:
  promote:
    if: github.event.head_commit.message == 'Add stable promotion helper'
    runs-on: windows-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/user-friendly-manager

      - name: Promote RC15 source to stable v1.0.0
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8 = New-Object System.Text.UTF8Encoding($false)

          function Read-All([string]$Path) {
            return [System.IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE $Path))
          }
          function Write-All([string]$Path, [string]$Text) {
            [System.IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE $Path), $Text, $utf8)
          }

          $managerPath = 'scripts\BPSRRelayManager.ps1'
          $manager = Read-All $managerPath
          if (-not $manager.Contains("`$ManagerVersion = '1.0.0-rc.15'")) { throw 'Expected RC15 ManagerVersion not found.' }
          $manager = $manager.Replace("`$ManagerVersion = '1.0.0-rc.15'", "`$ManagerVersion = '1.0.0'")
          $manager = $manager.Replace('RC.15', 'v1.0.0')
          Write-All $managerPath $manager

          $uiPath = 'scripts\ManagerUi.ps1'
          $ui = Read-All $uiPath
          $ui = $ui.Replace('RC.15', 'v1.0.0')
          Write-All $uiPath $ui

          $readmePath = 'README.md'
          $readme = Read-All $readmePath
          $readme = $readme.Replace('Current test build: **v1.0.0-rc.15**', 'Current stable release: **v1.0.0**')
          $readme = $readme.Replace('v1.0.0-rc.15', 'v1.0.0')
          $readme = $readme.Replace('RC.15', 'v1.0.0')
          $readme = [regex]::Replace(
            $readme,
            '(?m)^> v1\.0\.0 is a compatibility test build\..*$',
            '> v1.0.0 keeps the field-tested **Clean v4-compatible** two-stage SOCKS5 path validated on real Android + BPSR + DPS-meter use.'
          )
          $stableStatus = @"
## Release status

**v1.0.0 is the current stable release.**

The Clean-v4-compatible Android → BPSRMobileFront → localhost StarSEA path passed the real Android + Windows + SFA + BPSR + compatible DPS-meter field test, including normal gameplay connectivity, acceptable latency, DPS capture, and no doubled DPS.

"@
          $readme = [regex]::Replace(
            $readme,
            '(?s)## Release status\r?\n.*?(?=## Disclaimer)',
            $stableStatus
          )
          if ($readme -match '1\.0\.0-rc\.' -or $readme -match '(?i)release candidate' -or $readme -match 'NOT quite yet') {
            throw 'README still contains prerelease gate wording after promotion.'
          }
          Write-All $readmePath $readme

          $validatePath = '.github\workflows\validate.yml'
          $validate = Read-All $validatePath
          if (-not $validate.Contains("`$ManagerVersion = '1.0.0-rc.15'")) { throw 'Validate workflow RC15 version invariant not found.' }
          $validate = $validate.Replace("`$ManagerVersion = '1.0.0-rc.15'", "`$ManagerVersion = '1.0.0'")
          $validate = $validate.Replace('RC.15', 'v1.0.0')
          Write-All $validatePath $validate

          $releasePath = '.github\workflows\release.yml'
          $release = Read-All $releasePath
          $release = $release.Replace('Smoke-test encrypted relay data path', 'Smoke-test v4-compatible two-stage relay data path')
          Write-All $releasePath $release

          $managerCheck = Read-All $managerPath
          if (-not $managerCheck.Contains("`$ManagerVersion = '1.0.0'")) { throw 'Stable ManagerVersion promotion failed.' }
          if ((Read-All $readmePath) -notmatch 'Current stable release: \*\*v1\.0\.0\*\*') { throw 'Stable README marker missing.' }

          $paths = @($managerPath, $uiPath)
          foreach ($relative in $paths) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $relative), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw ($relative + ' parse failed: ' + (($errors | ForEach-Object Message) -join '; ')) }
          }

          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }

      - name: Commit stable source promotion
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/BPSRRelayManager.ps1 scripts/ManagerUi.ps1 README.md .github/workflows/validate.yml .github/workflows/release.yml
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw 'Stable promotion produced no changes.' }
          git commit -m 'Promote field-tested RC15 to v1.0.0'
          git push origin HEAD:feature/user-friendly-manager
