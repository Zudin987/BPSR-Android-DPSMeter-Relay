name: Publish RC12 Prerelease

on:
  push:
    branches:
      - feature/user-friendly-manager
    paths:
      - .github/workflows/publish-rc12-prerelease.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: Zudin987/BPSR-Android-DPSMeter-Relay
      TAG: v1.0.0-rc.12
      VALIDATED_SHA: c6fb12cef452cea04fa393937165096b2913462f
      VALIDATE_RUN: '33239432835'
      EXPECTED_SHA256: 423f9f678c69f6f2c1017399f1ef6111b60670e7f19322f85e30903955102586
    steps:
      - name: Confirm release does not already exist
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace it." >&2
            exit 1
          fi
      - name: Confirm validated run belongs to exact source
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(gh run view "$VALIDATE_RUN" --repo "$REPO" --json headSha --jq .headSha)"
          conclusion="$(gh run view "$VALIDATE_RUN" --repo "$REPO" --json conclusion --jq .conclusion)"
          test "$actual_sha" = "$VALIDATED_SHA"
          test "$conclusion" = "success"
      - name: Download exact validated package
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-artifact
          gh run download "$VALIDATE_RUN" --repo "$REPO" --name validated-release-candidate --dir release-artifact
          test -f release-artifact/BPSR-Android-DPSMeter-Relay-v1.0.0-rc.12.zip
          test -f release-artifact/BPSR-Android-DPSMeter-Relay-v1.0.0-rc.12.zip.sha256
          actual="$(sha256sum release-artifact/BPSR-Android-DPSMeter-Relay-v1.0.0-rc.12.zip | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA256"
          grep -Fq "$EXPECTED_SHA256" release-artifact/BPSR-Android-DPSMeter-Relay-v1.0.0-rc.12.zip.sha256
      - name: Publish prerelease
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          ## BPSR Android DPSMeter Relay v1.0.0-rc.12

          Release candidate for real Android + Windows field testing.

          ### RC.12 fixes
          - **Prepare Relay** now names the exact old relay process it found and can safely close it for you before continuing.
          - Fixed the **Prepare Relay** button alignment and added a clear **Preparing...** state.
          - Setup now uses pinned official sing-box v1.13.19 download metadata and SHA256 verification instead of a rate-limited GitHub release API lookup.
          - Gameplay relay architecture and latency-sensitive polling are unchanged.

          ### Simple use
          1. Extract the ZIP.
          2. Open **BPSR Relay Manager.exe**.
          3. Follow **Prepare Relay → Allow Firewall → Send to Phone → Start Relay**.
          4. Import the phone profile in SFA and select BPSR only.
          5. Set a compatible DPS meter to capture **StarSEA**.

          This is a prerelease. Stable v1.0.0 remains gated on a real phone/BPSR test confirming normal connection, acceptable latency, DPS capture, and no doubled DPS.
          EOF
          gh release create "$TAG" \
            --repo "$REPO" \
            --target "$VALIDATED_SHA" \
            --title "BPSR Android DPSMeter Relay v1.0.0-rc.12" \
            --notes-file release-notes.md \
            --prerelease \
            release-artifact/BPSR-Android-DPSMeter-Relay-v1.0.0-rc.12.zip \
            release-artifact/BPSR-Android-DPSMeter-Relay-v1.0.0-rc.12.zip.sha256
      - name: Verify published release
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$REPO" --json isPrerelease,tagName,targetCommitish --jq 'select(.isPrerelease == true and .tagName == "v1.0.0-rc.12")' >/dev/null
