name: Publish RC15 Prerelease

on:
  push:
    branches:
      - feature/user-friendly-manager
    paths:
      - .github/workflows/publish-rc15-prerelease.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VALIDATED_RUN: '33244241154'
      VALIDATED_SHA: '75a60367e80a24b55877af6c2f1febbba8d9766a'
      ZIP_SHA256: '1f47598c3b74e1604f8df1aa421cee67e080d25012400d234ade7ce7800057c1'
    steps:
      - name: Download exact validated artifact
        run: |
          set -euo pipefail
          mkdir release-artifact
          gh run download "$VALIDATED_RUN" --repo "$GITHUB_REPOSITORY" --name validated-release-candidate --dir release-artifact
          ls -la release-artifact

      - name: Verify exact package
        run: |
          set -euo pipefail
          cd release-artifact
          test -f BPSR-Android-DPSMeter-Relay-v1.0.0-rc.15.zip
          test -f BPSR-Android-DPSMeter-Relay-v1.0.0-rc.15.zip.sha256
          ACTUAL=$(sha256sum BPSR-Android-DPSMeter-Relay-v1.0.0-rc.15.zip | awk '{print $1}')
          test "$ACTUAL" = "$ZIP_SHA256"
          grep -F "$ZIP_SHA256  BPSR-Android-DPSMeter-Relay-v1.0.0-rc.15.zip" BPSR-Android-DPSMeter-Relay-v1.0.0-rc.15.zip.sha256

      - name: Publish prerelease
        run: |
          set -euo pipefail
          if gh release view v1.0.0-rc.15 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v1.0.0-rc.15 already exists; refusing to replace a release.'
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          ## BPSR Android DPSMeter Relay v1.0.0-rc.15

          RC.15 restores the original Clean v4-compatible two-stage SOCKS5 relay path after RC.13/RC.14 failed the real Android field test.

          ### Important Android step
          Delete or disable the old RC.13/RC.14 SFA profile and import the newly generated RC.15 profile. Do not reuse the RC.14 profile.

          ### RC.15 path
          Android SFA → BPSRMobileFront → localhost StarSEA → BPSR server.

          `StarSEA` remains the universal DPS-meter capture target. Do not target `BPSRMobileFront`.

          This exact package passed Windows PowerShell parsing, v4 compatibility and single-count guards, UI checks, pinned sing-box config self-test, a two-stage SOCKS relay data-path smoke test, phone-profile server tests, and EXE-first package verification.

          Stable v1.0.0 remains gated on a successful real Android + BPSR + DPS-meter field test.
          EOF
          gh release create v1.0.0-rc.15 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$VALIDATED_SHA" \
            --title 'BPSR Android DPSMeter Relay v1.0.0-rc.15' \
            --notes-file release-notes.md \
            --prerelease \
            release-artifact/BPSR-Android-DPSMeter-Relay-v1.0.0-rc.15.zip \
            release-artifact/BPSR-Android-DPSMeter-Relay-v1.0.0-rc.15.zip.sha256
