name: Apply v1.0.4 polish hardening

on:
  push:
    branches:
      - feat/v104-polish-hardening
    paths:
      - .github/workflows/apply-v104-polish.yml
      - .github/scripts/apply_v104.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/v104-polish-hardening

      - name: Apply source patch
        run: |
          python3 .github/scripts/apply_v104.py
          # GitHub's Actions token cannot push workflow-file changes. Keep those
          # for a direct authenticated edit after the normal source patch lands.
          git checkout HEAD -- .github/workflows/validate.yml .github/workflows/release.yml .github/workflows/apply-v104-polish.yml

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish v1.0.4 safety and release metadata"
          git push origin HEAD:feat/v104-polish-hardening
