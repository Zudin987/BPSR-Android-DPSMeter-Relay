name: Apply Firewall Verifier Hotfix

on:
  push:
    branches:
      - fix/firewall-verification-v1.0.2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/firewall-verification-v1.0.2
          fetch-depth: 0

      - name: Apply v1.0.2-rc.1 firewall verification fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manager_path = Path('scripts/BPSRRelayManager.ps1')
          text = manager_path.read_text(encoding='utf-8')

          old_marker = "function Test-FirewallReady {"
          if old_marker not in text:
              raise SystemExit('Test-FirewallReady function not found')

          replacement = r'''function Test-FirewallProfileIsPrivate {
              param($Value)

              foreach ($item in @($Value)) {
                  $text = ([string]$item).Trim()
                  if ($text.Equals('Private', [System.StringComparison]::OrdinalIgnoreCase) -or $text -eq '2') {
                      return $true
                  }
              }
              return $false
          }

          function Test-FirewallProtocolMatches {
              param($Value, [string]$Expected)

              $accepted = switch ($Expected.ToUpperInvariant()) {
                  'TCP' { @('TCP', '6') }
                  'UDP' { @('UDP', '17') }
                  default { @($Expected) }
              }

              foreach ($item in @($Value)) {
                  $text = ([string]$item).Trim()
                  foreach ($candidate in $accepted) {
                      if ($text.Equals($candidate, [System.StringComparison]::OrdinalIgnoreCase)) {
                          return $true
                      }
                  }
              }
              return $false
          }

          function Test-FirewallValueContains {
              param($Value, [string]$Expected)

              foreach ($item in @($Value)) {
                  if (([string]$item).Trim().Equals($Expected, [System.StringComparison]::OrdinalIgnoreCase)) {
                      return $true
                  }
              }
              return $false
          }

          function Test-FirewallLocalSubnetScope {
              param($Value)

              foreach ($item in @($Value)) {
                  $text = ([string]$item).Trim()
                  if ($text.Equals('LocalSubnet', [System.StringComparison]::OrdinalIgnoreCase) -or
                      $text.Equals('LocalSubnet4', [System.StringComparison]::OrdinalIgnoreCase)) {
                      return $true
                  }
              }
              return $false
          }

          function Test-FirewallReady {
              param([string]$PcIp)
              if ((Get-NetworkCategoryForIp -Address $PcIp) -ne 'Private') { return $false }

              $tcpReady = $false
              $udpReady = $false
              try {
                  $rules = @(Get-NetFirewallRule -DisplayName $FirewallRuleName -ErrorAction SilentlyContinue | Where-Object {
                      ([string]$_.Enabled).Equals('True', [System.StringComparison]::OrdinalIgnoreCase) -and
                      ([string]$_.Direction).Equals('Inbound', [System.StringComparison]::OrdinalIgnoreCase) -and
                      ([string]$_.Action).Equals('Allow', [System.StringComparison]::OrdinalIgnoreCase) -and
                      (Test-FirewallProfileIsPrivate -Value $_.Profile)
                  })

                  foreach ($rule in $rules) {
                      $ports = @(Get-NetFirewallPortFilter -AssociatedNetFirewallRule $rule -ErrorAction SilentlyContinue)
                      $addresses = @(Get-NetFirewallAddressFilter -AssociatedNetFirewallRule $rule -ErrorAction SilentlyContinue)
                      if ($ports.Count -eq 0 -or $addresses.Count -eq 0) { continue }

                      foreach ($port in $ports) {
                          if (-not (Test-FirewallValueContains -Value $port.LocalPort -Expected ([string]$FrontPort))) {
                              continue
                          }

                          foreach ($addr in $addresses) {
                              if (-not (Test-FirewallValueContains -Value $addr.LocalAddress -Expected $PcIp)) {
                                  continue
                              }
                              if (-not (Test-FirewallLocalSubnetScope -Value $addr.RemoteAddress)) {
                                  continue
                              }

                              # NetSecurity may expose Protocol as TCP/UDP strings or
                              # IANA protocol numbers (6/17), depending on Windows build.
                              if (Test-FirewallProtocolMatches -Value $port.Protocol -Expected 'TCP') { $tcpReady = $true }
                              if (Test-FirewallProtocolMatches -Value $port.Protocol -Expected 'UDP') { $udpReady = $true }
                          }
                      }
                  }
              }
              catch { return $false }

              return $tcpReady -and $udpReady
          }

          function Allow-Firewall {'''

          pattern = re.compile(r'function Test-FirewallReady \{.*?\n\}\n\nfunction Allow-Firewall \{', re.S)
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one firewall verifier replacement, got {count}')

          text = text.replace("$ManagerVersion = '1.0.1'", "$ManagerVersion = '1.0.2-rc.1'", 1)
          text = text.replace('v1.0.1', 'v1.0.2-rc.1')

          selftest_anchor = "    if ($sourceText -notmatch 'Protocol UDP') {\n        throw 'Self-test found missing UDP trusted-LAN firewall rule.'\n    }\n"
          selftest_extra = selftest_anchor + r'''

              # Windows NetSecurity is not consistent about whether Protocol/Profile
              # are surfaced as friendly names or numeric enum values. Both forms must
              # validate without widening the Private-LAN rule scope.
              if (-not (Test-FirewallProfileIsPrivate -Value 'Private') -or
                  -not (Test-FirewallProfileIsPrivate -Value '2') -or
                  (Test-FirewallProfileIsPrivate -Value 'Any')) {
                  throw 'Self-test found incompatible or over-broad firewall profile normalization.'
              }
              if (-not (Test-FirewallProtocolMatches -Value 'TCP' -Expected 'TCP') -or
                  -not (Test-FirewallProtocolMatches -Value '6' -Expected 'TCP') -or
                  -not (Test-FirewallProtocolMatches -Value 'UDP' -Expected 'UDP') -or
                  -not (Test-FirewallProtocolMatches -Value '17' -Expected 'UDP') -or
                  (Test-FirewallProtocolMatches -Value '17' -Expected 'TCP')) {
                  throw 'Self-test found incompatible firewall protocol normalization.'
              }
              if (-not (Test-FirewallLocalSubnetScope -Value 'LocalSubnet') -or
                  -not (Test-FirewallLocalSubnetScope -Value 'LocalSubnet4') -or
                  (Test-FirewallLocalSubnetScope -Value 'Any')) {
                  throw 'Self-test found incompatible or over-broad LocalSubnet normalization.'
              }
          '''
          if selftest_anchor not in text:
              raise SystemExit('Self-test firewall anchor not found')
          text = text.replace(selftest_anchor, selftest_extra, 1)
          manager_path.write_text(text, encoding='utf-8', newline='')

          validate_path = Path('.github/workflows/validate.yml')
          validate = validate_path.read_text(encoding='utf-8')
          validate = validate.replace('v1.0.1', 'v1.0.2-rc.1')
          validate = validate.replace("`$ManagerVersion = '1.0.1'", "`$ManagerVersion = '1.0.2-rc.1'")

          required_anchor = "            '-RemoteAddress LocalSubnet -Profile Private -EdgeTraversalPolicy Block',\n"
          required_extra = required_anchor + "            'function Test-FirewallProtocolMatches',\n            \"@('TCP', '6')\",\n            \"@('UDP', '17')\",\n            'function Test-FirewallProfileIsPrivate',\n            'function Test-FirewallLocalSubnetScope',\n"
          if required_anchor not in validate:
              raise SystemExit('Validate firewall invariant anchor not found')
          validate = validate.replace(required_anchor, required_extra, 1)
          validate_path.write_text(validate, encoding='utf-8', newline='')
          PY

      - name: Review patch
        shell: bash
        run: |
          git diff --check
          git diff -- scripts/BPSRRelayManager.ps1 .github/workflows/validate.yml

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/BPSRRelayManager.ps1 .github/workflows/validate.yml
          git commit -m 'Fix Windows firewall rule verification'
          git push origin HEAD:fix/firewall-verification-v1.0.2
