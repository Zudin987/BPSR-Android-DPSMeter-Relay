name: Apply v1.1.1 UI UX polish

on:
  push:
    branches:
      - ui/v111-visibility-ux

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/v111-visibility-ux
          fetch-depth: 0
      - name: Rebuild UI changes from clean main source
        shell: powershell
        run: |
          git checkout origin/main -- 'src/BpsrRelayManager/MainForm.cs' 'src/BpsrRelayManager/VersionInfo.cs'
          python '.\scripts\ApplyV111UiPatch.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name 'MrEz'
          git config user.email '39240221+Zudin987@users.noreply.github.com'
          git rm 'scripts/ApplyV111UiPatch.py'
          git add 'src/BpsrRelayManager/MainForm.cs' 'src/BpsrRelayManager/VersionInfo.cs'
          git commit -m 'Improve native UI visibility and guided workflow'
          git push origin HEAD:ui/v111-visibility-ux
          if ($LASTEXITCODE -ne 0) { throw 'git push failed' }
