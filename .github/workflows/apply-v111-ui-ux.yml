name: Apply v1.1.1 UI UX polish

on:
  push:
    branches:
      - ui/v111-visibility-ux

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/v111-visibility-ux
          fetch-depth: 0
      - name: Apply UI patch
        shell: powershell
        run: |
          $patchPath = '.\scripts\ApplyV111UiPatch.ps1'
          $lines = Get-Content $patchPath
          $out = New-Object System.Collections.Generic.List[string]
          $skip = 0
          foreach ($line in $lines) {
            if ($skip -gt 0) { $skip--; continue }
            if ($line -eq '$releasePath = ''.github\workflows\release.yml''') { $skip = 4; continue }
            if ($line -eq 'git rm ''.github/workflows/apply-v111-ui-ux.yml''') { continue }
            if ($line -eq 'git add $path $versionPath $releasePath') { $out.Add('git add $path $versionPath'); continue }
            if ($line -eq 'git push origin HEAD:ui/v111-visibility-ux') {
              $out.Add($line)
              $out.Add('if ($LASTEXITCODE -ne 0) { throw ''git push failed'' }')
              continue
            }
            $out.Add($line)
          }
          [IO.File]::WriteAllLines($patchPath, $out, (New-Object Text.UTF8Encoding($false)))
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $patchPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
