name: Apply v1.1.1 UI UX polish

on:
  push:
    branches:
      - ui/v111-visibility-ux

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/v111-visibility-ux
          fetch-depth: 0
      - name: Apply UI patch
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\scripts\ApplyV111UiPatch.ps1'
