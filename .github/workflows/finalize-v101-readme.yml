name: Finalize v1.0.1 README

on:
  push:
    branches:
      - feature/v1.0.1-hardening
    paths:
      - .github/workflows/finalize-v101-readme.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.0.1-hardening
      - name: Finalize stable version wording
        shell: powershell
        run: |
          $path = '.\README.md'
          $text = [System.IO.File]::ReadAllText($path)
          $text = $text.Replace('v1.0.0', 'v1.0.1')
          [System.IO.File]::WriteAllText($path, $text, (New-Object System.Text.UTF8Encoding($false)))
          if ((Get-Content $path -Raw) -match 'v1\.0\.0') { throw 'Stale v1.0.0 README wording remains.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Finalize README for v1.0.1 stable release'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:feature/v1.0.1-hardening
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
